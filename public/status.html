<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My status – FollowPay</title><meta name="description" content="Earn points by subscribing, following and liking. Spend them to grow your own YouTube channel or Instagram profile."><meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/core.css?v=30"></head>
<body data-page="status">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></symbol><symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.8c0-1.2 1-1.8 2.5-1.8s2.5.7 2.5 1.8c0 2.4-5 1.2-5 3.8 0 1.2 1 1.9 2.5 1.9s2.5-.6 2.5-1.9"/></symbol><symbol id="i-boost" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol><symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8C9 8 8 4.5 10 4s2 4 2 4zM12 8c3 0 4-3.5 2-4s-2 4-2 4z"/></symbol><symbol id="i-yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></symbol><symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol><symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/></symbol><symbol id="i-follow" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8h16v-8M12 15V3M8 7l4-4 4 4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol><symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol></defs></svg><header><b><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> FollowPay</b><span class="pill" id="pw" hidden><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span id="pts"></span></span></header><div class="bk"><a href="home.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>← Back to home</span></a></div>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div class="hd"><h1>My status</h1><button class="o sm" id="rf"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg> Refresh</button></div><p class="m">Orders, reports, refills and rewards for YouTube and Instagram, all in one place.</p>
<div class="sum" id="sm"></div><div class="pfl" id="pf"></div><div id="t"></div>
</main>
<script src="/core.js?v=30"></script>
<script type="module">
await start();
const TY={subscribe:'Subscribers',follow:'Followers',like:'Likes',views:'Views',comment:'Comments',watch:'Watch time',visits:'Profile visits'},TIER={normal:'Normal',premium:'Premium',ultra:'Ultra premium'},PRIO=['subscribe','follow','like'];
const BK={pending:['Pending','clock'],progress:['In progress','refresh'],solved:['Solved','shield'],closed:['Closed','out']},KD={order:['Order','boost'],report:['Report','msg'],refill:['Refill','refresh'],reward:['Reward','gift']};
let ST='all',PF='all',ITEMS=[];
const dt=n=>n?new Date(n).toLocaleString():'';
async function load(){
  const [a,b,c]=await Promise.all([api('orders',{platform:'youtube'}),api('orders',{platform:'instagram'}),api('myRedeems').catch(()=>({list:[]}))]),it=[];
  for(const [p,l] of [['youtube',a.orders],['instagram',b.orders]])for(const x of l||[]){
    it.push({k:'order',p,t:x.created||0,s:x.status==='completed'?'solved':'progress',x});
    if(x.refill)it.push({k:'refill',p,t:x.refill.at||x.completedAt||x.created||0,s:({review:'pending',done:'solved',rejected:'closed'})[x.refill.status]||'pending',x});
    for(const z of x.reports||[])it.push({k:'report',p,t:z.at||0,s:({open:'pending',processing:'progress',solved:'solved'})[z.status]||'pending',x,z});
  }
  for(const z of c.list||[])it.push({k:'reward',p:'rewards',t:z.at||0,s:z.status==='cancelled'?'closed':(z.code||z.status==='paid')?'solved':'pending',z});
  ITEMS=it.sort((m,n)=>n.t-m.t);draw();
}
const card=e=>{
  const [bn,bi]=BK[e.s],[kn,ki]=KD[e.k],x=e.x,pi=e.p==='youtube'?'yt':e.p==='instagram'?'ig':'gift';
  let title='',body='',foot='';
  const ot=x?`${TY[x.type]} · ${esc(x.handle)}`:'';
  const open=x?`<button class="o" data-o="${x.id}" data-p="${e.p}">${I('boost')} Open order</button>`:'';
  if(e.k==='order'){const w=x.type==='watch',d=x.status==='completed'?x.qty:(x.done||0),p=Math.min(100,Math.round(d/x.qty*100)),pr=PRIO.includes(x.type)?` · ${TIER[x.tier||'normal']}`:'';
    title=ot;body=`<p class="m" style="margin:0">${PL[e.p]}${pr}</p><div class="pb" style="margin:10px 0 4px" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><p class="m" style="margin:0"><b>${w?d*x.mins+' of '+x.qty*x.mins+' min':d+' of '+x.qty}</b> · ${p}%</p>`;foot=open}
  else if(e.k==='report'){title='Report on '+ot;body=`<div class="cm2">${esc(e.z.comment)}</div>${e.z.note?`<p class="m" style="margin:0">${I('info')} Admin: ${esc(e.z.note)}</p>`:''}`;foot=open}
  else if(e.k==='refill'){title='Refill for '+ot;body=`<p class="m" style="margin:0">${e.s==='solved'?'Your refill was completed.':e.s==='closed'?'Your refill request was not approved.':'Our team is reviewing your refill request.'}</p>`;foot=open}
  else{const z=e.z;title=`${esc(z.name)} · ₹${z.rs}`;body=`<p class="m" style="margin:0">${z.type==='upi'?'UPI: '+esc(z.upi||''):'Gift card code delivered. Find it in Rewards → My orders.'}</p>${z.status==='cancelled'?`<p class="m" style="margin:4px 0 0;color:#991b1b">${z.pts} points refunded${z.note?' · '+esc(z.note):''}</p>`:z.note?`<p class="m" style="margin:4px 0 0">${esc(z.note)}</p>`:''}`;foot=`<a class="b o sm" href="store.html" style="width:auto;margin:0">${I('gift')} Rewards</a>`}
  return `<article class="card sc ${e.s}"><div class="sh"><span class="big-ic">${I(pi)}</span><div style="flex:1;min-width:0"><span class="kind">${kn}</span><h2>${title}</h2></div><span class="sbd">${I(bi)} ${bn}</span></div>${body}<div class="ft"><span class="m">${dt(e.t)}</span>${foot}</div></article>`};
function draw(){
  const byP=ITEMS.filter(e=>PF==='all'||e.p===PF),cnt=k=>byP.filter(e=>e.s===k).length;
  $('#sm').innerHTML=[['all','All',byP.length],['pending','Pending',cnt('pending')],['progress','In progress',cnt('progress')],['solved','Solved',cnt('solved')]].concat(cnt('closed')?[['closed','Closed',cnt('closed')]]:[]).map(([k,n,v])=>`<button type="button" class="sm4${k===ST?' sel':''}" data-s="${k}"><b>${v}</b><span>${n}</span></button>`).join('');
  $('#pf').innerHTML=[['all','All'],['youtube','YouTube'],['instagram','Instagram'],['rewards','Rewards']].map(([k,n])=>`<button type="button" class="${k===PF?'':'o'}" data-pf="${k}">${k==='youtube'?I('yt')+' ':k==='instagram'?I('ig')+' ':k==='rewards'?I('gift')+' ':''}${n}</button>`).join('');
  const l=byP.filter(e=>ST==='all'||e.s===ST);
  $('#t').innerHTML=l.map(card).join('')||`<div class="card"><b>Nothing here yet</b><p class="m">${ITEMS.length?'No items match this filter.':'When you place orders, send reports or redeem rewards, their status will show up here.'}</p></div>`;
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-s]'),p=e.target.closest('[data-pf]'),o=e.target.closest('[data-o]');
  if(s){ST=s.dataset.s;draw()}else if(p){PF=p.dataset.pf;if(ST==='closed')ST='all';draw()}
  else if(o){location.href='orders.html#o-'+o.dataset.o}});
$('#rf').onclick=async()=>{const b=$('#rf');b.disabled=true;try{await load()}catch(er){say(er.message)}b.disabled=false};
try{await load()}catch(er){say(er.message,'Could not load your status')}
setInterval(()=>{if(!document.hidden)load().catch(()=>{})},20000);
</script></body></html>
