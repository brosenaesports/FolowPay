<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b1020">
<title>Premium Orders – FollowPay</title>
<link rel="stylesheet" href="/premium.css?v=1">
</head><body>
<div id="shell"></div>
<script src="/pm.js?v=1"></script>
<script type="module">
shell('orders');
const app=$('#app');
let ORD=[],TK=[],view='orders',flt='all';
app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1 style="margin:.2em 0">My orders</h1><div style="display:flex;gap:8px"><button class="sm ghost" id="nt">${I('ticket')} New ticket</button><button class="sm dark" id="rf">${I('refresh')} Refresh</button></div></div>
<p class="m" style="margin-top:0">Every order shows the order number from the booster service. Quote it when you need help.</p>
<div class="chips" id="vw"></div><div class="chips" id="fl"></div><div id="ls"><div class="ldg"><span class="sp"></span> Loading orders…</div></div>`;
const SB=s=>{const t=String(s||'').toLowerCase();return /^completed/.test(t)?['c','Completed','g']:/^partial/.test(t)?['r','Partial','v']:/^(canceled|cancelled|refunded|fail)/.test(t)?['x','Canceled','r']:/^(in progress|processing)/.test(t)?['i','In progress','b']:/^confirming/.test(t)?['p','Confirming','a']:['p','Pending','a']};
const RB=s=>/^completed/i.test(s)?['Completed','g']:/^(rejected|canceled|cancelled|error|fail)/i.test(s)?['Not approved','r']:/^(in progress|processing)/i.test(s)?['In progress','b']:['Pending','a'];
const TS={open:['Open','a'],processing:['In progress','b'],solved:['Solved','g']};
const done=o=>o.status&&/^completed/i.test(o.status);
const activeO=o=>!/^(completed|partial|canceled|cancelled|refunded|fail)/i.test(o.status||'');
function card(o){
  const [cls,label,bc]=SB(o.status),del=o.remains!=null?Math.max(0,o.qty-o.remains):(done(o)?o.qty:0),pct=Math.min(100,Math.round(del/o.qty*100)),
    openRf=o.refills.find(f=>!/^(completed|rejected|canceled|cancelled|error|failed)/i.test(f.status));
  return `<article class="card od s-${cls}"><div class="oh"><span class="pi pf-${o.p}">${pIcon(o.p)}</span><div style="flex:1;min-width:0"><h2>${esc(o.name)}</h2><span class="lk">${esc(o.link)}</span></div><span class="bdg ${bc}">${label}</span></div>
  <div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${o.panel?`<button type="button" class="num" data-cp="${esc(o.panel)}" aria-label="Copy order number">${I('copy')} Order #${esc(o.panel)}</button>`:'<span class="bdg a">Order number pending</span>'}<span class="m">${dt(o.created)}</span></div>
  <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="m">${del.toLocaleString('en-IN')} of ${o.qty.toLocaleString('en-IN')} · ${pct}%${o.start!=null?' · started at '+o.start.toLocaleString('en-IN'):''}</div>
  <div class="kv"><span>Paid</span><b>${INR(o.price)}</b></div>${o.refunded>0?`<div class="kv"><span>Returned to wallet</span><b style="color:var(--green)">${INR(o.refunded)}</b></div>`:''}
  ${o.refills.map(f=>{const [n,c]=RB(f.status);return `<div class="kv"><span>${I('refresh')} Refill #${esc(f.id)}</span><span class="bdg ${c}">${n}</span></div>`}).join('')}
  ${o.tickets.map(t=>{const [n,c]=TS[t.status]||TS.open;return `<div class="tk"><span class="bdg ${c}">${I('ticket')} Ticket · ${n}</span><div style="margin-top:4px">${esc(t.msg)}</div>${t.note?`<div class="m" style="margin-top:4px">${I('info')} Reply: ${esc(t.note)}</div>`:''}</div>`}).join('')}
  <div class="acts">${o.canRefill?(done(o)&&!openRf?`<button data-rf="${o.id}">${I('refresh')} Request refill</button>`:`<button disabled>${I('refresh')} ${openRf?'Refill in progress':'Refill after completion'}</button>`):`<span class="bdg n" style="justify-content:center;min-height:44px">No refill for this service</span>`}
  <button class="ghost" data-tk="${o.id}">${I('ticket')} Raise ticket</button></div></article>`}
function draw(){
  $('#vw').innerHTML=[['orders','Orders',ORD.length],['tickets','Tickets',TK.length]].map(([k,n,c])=>`<button type="button" class="${k===view?'on':''}" data-v="${k}">${n} (${c})</button>`).join('');
  $('#fl').hidden=view!=='orders';
  $('#fl').innerHTML=[['all','All'],['active','Active'],['done','Completed'],['closed','Closed']].map(([k,n])=>`<button type="button" class="${k===flt?'on':''}" data-f="${k}">${n}</button>`).join('');
  if(view==='orders'){
    const l=ORD.filter(o=>flt==='all'||(flt==='active'&&activeO(o))||(flt==='done'&&done(o))||(flt==='closed'&&!activeO(o)&&!done(o)));
    $('#ls').innerHTML=l.map(card).join('')||`<div class="card"><b>${ORD.length?'No orders in this filter':'No orders yet'}</b><p class="m">${ORD.length?'Try another filter.':'Place your first order on the Booster page.'}</p>${ORD.length?'':'<a class="pmbtn" href="premium.html">'+I('bolt')+' Go to Booster</a>'}</div>`;
  }else{
    $('#ls').innerHTML=TK.map(t=>{const [n,c]=TS[t.status]||TS.open,o=ORD.find(x=>x.id===t.oid);return `<article class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><span class="bdg ${c}">${I('ticket')} ${n}</span><span class="m">${dt(t.at)}</span></div>${t.panel?`<p style="margin:.6em 0 0"><span class="num" style="cursor:default">Order #${esc(t.panel)}</span>${o?' <span class="m">'+esc(o.name)+'</span>':''}</p>`:'<p class="m" style="margin:.6em 0 0">General ticket</p>'}<div class="tk">${esc(t.msg)}</div>${t.note?`<p class="m" style="margin:0">${I('info')} Reply: ${esc(t.note)}</p>`:'<p class="m" style="margin:0">We will reply here as soon as possible.</p>'}</article>`}).join('')||'<div class="card"><b>No tickets yet</b><p class="m">Raise a ticket from any order if something is wrong.</p></div>';
  }
}
async function load(quiet){
  try{const [o,t]=await Promise.all([api('pmOrders'),api('pmTickets')]);ORD=o.orders;TK=t.tickets;draw()}
  catch(e){if(!quiet)$('#ls').innerHTML=`<div class="card"><b>Could not load orders</b><p class="m">${esc(e.message)}</p></div>`}
}
async function ticket(oid){
  const o=oid?ORD.find(x=>x.id===oid):null;
  const d=document.createElement('div');d.className='pmov';
  d.innerHTML=`<div class="pmpop" role="dialog" aria-modal="true"><b>Raise a ticket</b>${o?`<p class="m" style="margin:.4em 0">${esc(o.name)}<br>${o.panel?'<span class="num" style="cursor:default">Order #'+esc(o.panel)+'</span>':''}</p>`:'<p class="m">Tell us what you need help with.</p>'}<label for="tm">Your message</label><textarea id="tm" maxlength="600" placeholder="Describe the problem…"></textarea>
  <div class="pmbtns"><button type="button" class="ghost" data-x>Cancel</button><button type="button" id="ts">Send ticket</button></div></div>`;
  d.onclick=e=>{if(e.target===d||e.target.closest('[data-x]'))d.remove()};document.body.append(d);$('#tm',d).focus();
  $('#ts',d).onclick=async()=>{const b=$('#ts',d),m=$('#tm',d).value.trim();if(m.length<5)return say('Write at least 5 characters.','Message needed');
    spin(b,'Sending…');try{await api('pmTicket',{orderId:oid||undefined,message:m});d.remove();await say('Your ticket was sent. We will reply here.','Ticket sent');view='tickets';load()}catch(e){unspin(b);say(e.message,'Could not send ticket')}};
}
app.addEventListener('click',async e=>{
  const v=e.target.closest('[data-v]'),f=e.target.closest('[data-f]'),cp=e.target.closest('[data-cp]'),rf=e.target.closest('[data-rf]'),tk=e.target.closest('[data-tk]');
  if(v){view=v.dataset.v;draw()}else if(f){flt=f.dataset.f;draw()}
  else if(cp)navigator.clipboard.writeText(cp.dataset.cp).then(()=>say('Order number copied.','Copied')).catch(()=>say('Order number: '+cp.dataset.cp))
  else if(tk)ticket(tk.dataset.tk)
  else if(rf){if(!await yes('Request a refill?','We will ask the booster service to refill this order. You can request again after 24 hours if needed.','Request refill'))return;
    spin(rf,'Requesting…');try{await api('pmRefill',{orderId:rf.dataset.rf});await say('Refill requested. The status will update here.','Refill requested');load()}catch(er){unspin(rf);say(er.message,'Could not request refill')}}
});
$('#nt').onclick=()=>ticket(null);
$('#rf').onclick=async()=>{const b=$('#rf');spin(b,'Refreshing…');await load();unspin(b)};
api('pmWallet').then(w=>setBal(w.bal)).catch(()=>{});
await load();
setInterval(()=>{if(!document.hidden&&!$('.pmov'))load(true)},30000);
</script></body></html>
