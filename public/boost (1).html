1 2-2h10"/></symbol><symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol><symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol></defs></svg><header><b><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> FollowPay</b><span class="pill" id="pw" hidden><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span id="pts"></span></span></header><div class="bk"><a href="home.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>← Back to home</span></a></div>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div id="sp"></div><div class="hd"><h1>Free Booster</h1><div style="display:flex;gap:8px"><a class="b o sm" href="orders.html" style="width:auto;margin:0"><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> My orders</a><button class="o sm" id="rt"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg> Rates</button></div></div><div id="t"></div>
</main>
<script src="/core.js?v=30"></script>
<script type="module">
$('#sp').innerHTML=`<p class="m" style="margin:10px 0 0"><b>Choose platform</b></p><div class="plt" role="radiogroup" aria-label="Platform">${[['youtube','yt','YouTube','Subscribers, likes, views'],['instagram','ig','Instagram','Followers, likes, views']].map(([k,ic,n,d])=>`<button type="button" class="pl ${k}${k===plat?' sel':''}" role="radio" aria-checked="${k===plat}" data-sp="${k}"><span class="pli">${I(ic)}</span><span class="pln"><b>${n}</b><small>${d}</small></span><span class="ck" aria-hidden="true">✓</span></button>`).join('')}</div>`;platBind();
const yt=plat==='youtube',RT=(n,v)=>`<div class="row"><span>${n}</span><b>${v}</b></div>`;
$('#rt').onclick=()=>box('Free Booster rates',(yt?RT(I('bell')+' Normal subscriber','2 points')+RT(I('star')+' Premium subscriber','12 points')+RT(I('zap')+' Ultra premium subscriber','12 points'):RT(I('follow')+' Normal follower','3 points')+RT(I('star')+' Premium follower','4 points')+RT(I('zap')+' Ultra premium follower','5 points'))
  +RT(I('heart')+' Normal like','2 points')+RT(I('star')+' Premium like','3 points')+RT(I('zap')+' Ultra premium like','4 points')
  +RT(I('eye')+' Views','1 point')+RT(I('msg')+' Comments','1 point')+(yt?RT(I('clock')+' Watch time','8 points / minute'):RT(I('boost')+' Profile visits','1 point'))
  +'<p class="m"><mark>Premium and Ultra premium</mark> orders get fast boosting priority and a free refill for up to 30 days (one refill per order).</p><p class="m">Normal followers, likes and subscribers can drop up to 10% and have no refill. Completed normal orders are removed from My orders 3 days after completion.</p>');
const t=$('#t'),TO=ms=>new Promise((_,j)=>setTimeout(()=>j(new Error('The server is taking too long. Tap Retry.')),ms));
t.innerHTML='<div class="ld"><span class="sp"></span><span>Loading… the server may take a few seconds to wake up.</span></div>';
let r;
try{r=await Promise.race([start(),TO(25000)])}
catch(e){t.innerHTML=`<div class="card"><p class="m">${esc(e.message)}</p><button id="rty">Retry</button></div>`;$('#rty').onclick=()=>location.reload();throw e}
const CATS=yt?[['subscribe','Subscribers','bell'],['like','Likes','heart'],['views','Views','eye'],['comment','Comments','msg'],['watch','Watch time','clock']]:[['follow','Followers','follow'],['like','Likes','heart'],['views','Views','eye'],['comment','Comments','msg'],['visits','Profile visits','boost']];
const PRI=[['normal','Normal','user','Standard speed.'],['premium','Premium','star','Fast boosting priority + free refill for up to 30 days.'],['ultra','Ultra premium','zap','Fastest boosting priority + free refill for up to 30 days.']];
const NMS={subscribe:'Subscribers',follow:'Followers',like:'Likes',views:'Views',comment:'Comments',watch:'Watch time',visits:'Profile visits'};
const COST={subscribe:[2,12,12],follow:[3,4,5],like:[2,3,4],views:[1],comment:[1],visits:[1]},PK=[10,50,100,500,1000];
const hasPri=c=>['subscribe','follow','like'].includes(c);
let cat=CATS[0][0],pri='normal';
const chips=(el,arr,cur)=>{el.innerHTML=arr.map(([k,n,i])=>`<button type="button" class="${k===cur?'':'o'}" data-k="${k}">${I(i)}<span>${n}</span></button>`).join('')};
const spin=(b,t)=>{b.disabled=true;b.dataset.h=b.innerHTML;b.innerHTML=`<span class="sp"></span> ${t}`};
const LINKPH=()=>yt?(cat==='subscribe'?'Paste channel link or any video link':'Paste video link'):(['follow','visits'].includes(cat)?'Paste profile link (instagram.com/username)':'Paste reel or post link');
t.innerHTML=`<div class="card"><p class="m" style="margin:0 0 6px"><b>Paste the link, we do the rest.</b> No profile setup needed.</p>${plat==='instagram'?`<div class="pbn warn" role="note">${I('info')}<div><b>Your Instagram profile must be public</b><p>If your profile is <mark>private</mark>, the task will not complete and the points are <mark>non-refundable</mark>.</p></div></div>`:''}<p class="m">Category</p><div class="grid" id="cg"></div><div id="prw"><p class="m">Priority</p><div class="tg" id="pg" role="radiogroup" aria-label="Priority"></div><div id="pn"></div></div><p class="m" style="margin-bottom:4px" id="lbl">Link</p><input id="bk" type="url" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Link"><div id="wtp" hidden><p class="m" style="margin-bottom:4px">Watch time package</p><select id="bpk">${PK.map(m=>`<option value="${m}">${m.toLocaleString('en-IN')} minutes</option>`).join('')}</select><input id="bw" type="number" min="1" inputmode="numeric" placeholder="Video length in minutes (only if asked)"></div><input id="bq" type="number" min="1" inputmode="numeric"><div class="tot"><span>Total to pay</span><b id="tv">0</b><span>points</span></div><p class="m" id="sum" style="text-align:center"></p>${plat==='instagram'?'<p class="m" style="text-align:center">Make sure your Instagram profile is public. Orders on private profiles are non-refundable.</p>':''}<button id="bg">Create order</button></div><p class="m" style="text-align:center">After you order, follow it on <a href="orders.html">My orders</a> (report a problem or request a refill there).</p>`;
const bal=r.user.points||0;
const benefit=()=>pri==='normal'
  ?`<div class="pbn warn">${I('info')}<div><b>Normal priority</b><p>Standard speed. ${NMS[cat]} <mark>can drop up to 10%</mark> over time and no refill is included.</p></div></div>`
  :`<div class="pbn good">${I(pri==='ultra'?'zap':'star')}<div><b>${pri==='ultra'?'Ultra premium':'Premium'} benefits</b><ul><li><mark>${pri==='ultra'?'Fastest':'Fast'} boosting priority</mark>: your order is served first</li><li><mark>Free refill for 30 days</mark>: if ${NMS[cat].toLowerCase()} drop, ask for a refill</li><li>One refill per order, after it completes</li></ul></div></div>`;
const upd=()=>{
  chips($('#cg'),CATS,cat);
  const TB={normal:[['Standard speed'],['No refill',1],['Can drop up to 10%',1]],premium:[['Fast priority'],['Free 30-day refill']],ultra:[['Fastest priority'],['Free 30-day refill']]},SUB={normal:'Basic',premium:'Most popular',ultra:'Best results'},RB={premium:'Popular',ultra:'Best'};
  $('#pg').innerHTML=PRI.map(([k,n,i],ix)=>`<button type="button" class="tier ${k}${k===pri?' sel':''}" role="radio" aria-checked="${k===pri}" data-k="${k}">${RB[k]?`<span class="rb">${RB[k]}</span>`:''}<span class="ck" aria-hidden="true">✓</span><span class="tic">${I(i)}</span><span class="tn"><b>${n}</b><small>${SUB[k]}</small></span><span class="tp"><b>${COST[cat][ix]||''}</b><small>points each</small></span><ul>${TB[k].map(([t,x])=>`<li${x?' class="x"':''}>${t}</li>`).join('')}</ul></button>`).join('');
  const w=cat==='watch';
  $('#prw').hidden=!hasPri(cat);$('#pn').innerHTML=hasPri(cat)?benefit():'';
  $('#wtp').hidden=!w;$('#bq').hidden=w;
  $('#bk').placeholder=LINKPH();$('#lbl').textContent=LINKPH().replace('Paste ','').replace(/^./,c=>c.toUpperCase());
  $('#bq').placeholder='How many '+NMS[cat].toLowerCase()+(cat==='visits'?' (minimum 100)':'');
  let sm,tp=0;
  if(w){const len=+$('#bw').value||0,tot=+$('#bpk').value;
    if(len>=1){let m=Math.min(15,Math.floor(len),tot);while(m>1&&tot%m)m--;const n=tot/m;if(n>1000)sm='This video is too short for this package.';else{tp=n*m*8;sm=`${n} task${n>1?'s':''} of ${m} min (${n*m} min total) × 8 points`}}
    else{tp=tot*8;sm=`${tot} minutes × 8 points. If we cannot read the video length we will ask for it.`}}
  else{const q=+$('#bq').value||0,u=COST[cat][hasPri(cat)?PRI.findIndex(z=>z[0]===pri):0];if(q){tp=q*u;sm=`${q.toLocaleString('en-IN')} × ${u} points`}else sm='Enter how many you want.'}
  $('#tv').textContent=tp.toLocaleString('en-IN');
  $('#sum').innerHTML=esc(sm)+`<br>Your balance: <b>${bal.toLocaleString('en-IN')} points</b>`+(tp>bal?`<br><b style="color:#b91c1c">You need ${(tp-bal).toLocaleString('en-IN')} more points.</b> <a href="buy.html">Buy points</a> or <a href="earn.html">earn free points</a>`:'');
  $('#bg').textContent=tp?`Pay ${tp.toLocaleString('en-IN')} points and create order`:'Create order';
};
$('#cg').onclick=e=>{const b=e.target.closest('[data-k]');if(b){cat=b.dataset.k;upd()}};
$('#pg').onclick=e=>{const b=e.target.closest('[data-k]');if(b){pri=b.dataset.k;upd()}};
['bq','bw','bpk'].forEach(i=>{$('#'+i).oninput=upd});upd();
$('#bg').onclick=async()=>{const b=$('#bg');
  if(!$('#bk').value.trim())return say('Paste the link first.','Link needed');
  spin(b,'Placing your order…');
  try{const x=await api('boost',{platform:plat,type:cat,tier:pri,qty:+$('#bq').value,total:+$('#bpk').value,len:+$('#bw').value,link:$('#bk').value.trim()});
    ok(`${x.cost} points used. Your order is in progress. You can follow it on My orders.`,'Order placed',()=>location.href='orders.html');
  }catch(e){say(e.message,'Could not create order');b.disabled=false;delete b.dataset.h;upd()}};
</script></body></html>
