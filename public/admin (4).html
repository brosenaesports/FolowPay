<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<h1>Admin</h1><div id="t"></div>
</main>
<script src="/core.js?v=25"></script>
<script type="module">
hideLd();
const TP={normal:'',premium:'Premium ',ultra:'Ultra premium '},root=$('#t');
const prof=x=>x.platform==='youtube'?'https://www.youtube.com/'+x.handle:'https://www.instagram.com/'+x.handle.replace(/^@/,'')+'/';
const tk=()=>localStorage.getItem('fp_a');
const A=(a,x)=>Promise.race([api(a,{atoken:tk(),...x}),new Promise((_,j)=>setTimeout(()=>j(new Error('The server is taking too long. Tap Retry.')),20000))]);
const fail=e=>{if(/^Admin session/.test(e.message)){localStorage.removeItem('fp_a');login();return say(e.message)}
  const a=$('#ad');if(a){a.innerHTML=`<div class="card"><p class="m">${esc(e.message)}</p><button id="rty">Retry</button></div>`;$('#rty').onclick=panel}say(e.message)};
const ta='style="width:100%;border:2px solid #000;border-radius:10px;padding:10px;font:inherit;margin:6px 0"';
let tab='tasks';
function login(){
  root.innerHTML=`<div class="card"><b>${I('lock')} Admin sign in</b><p class="m">Only approved Google accounts can enter.</p><button id="gg">${I('user')} Sign in with Google</button></div>`;
  $('#gg').onclick=async()=>{try{const V='https://www.gstatic.com/firebasejs/10.12.2/',[A,B]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js')]);
    const c=await B.signInWithPopup(B.getAuth(A.initializeApp(CFG)),new B.GoogleAuthProvider());
    const r=await api('admGoogle',{idToken:await c.user.getIdToken()});localStorage.setItem('fp_a',r.atoken);panel()
  }catch(e){say(e.code==='auth/popup-closed-by-user'?'Sign-in window was closed.':e.code==='auth/unauthorized-domain'?'Add this website address in Firebase → Authentication → Settings → Authorized domains.':e.message,'Admin sign-in failed')}};
}
function panel(){
  const N={tasks:'Tasks',smm:'SMM',refills:'Refills',reports:'Reports',premium:'Premium',rewards:'Rewards',users:'Users',revenue:'Revenue',settings:'Admins'};
  root.innerHTML=`<div class="tabs" style="flex-wrap:wrap">${Object.entries(N).map(([k,n])=>`<button class="${k===tab?'':'o'}" data-t="${k}" style="flex:1 1 30%">${n}</button>`).join('')}</div><div id="ad"></div><button class="o" id="lo2">${I('out')} Log out</button>`;
  root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;panel()});
  $('#lo2').onclick=()=>{localStorage.removeItem('fp_a');login()};
  $('#ad').innerHTML='<div class="ld"><span class="sp"></span><span>Loading… the server may take a few seconds to wake up.</span></div>';
  ({tasks,smm,refills,reports,premium,rewards,users,revenue,settings})[tab]().catch(fail);
}
const TIER={normal:'Normal',premium:'Premium',ultra:'Ultra premium'},PRIOT=['subscribe','follow','like'];
const NMT={subscribe:'Subscribers',follow:'Followers',like:'Likes',views:'Views',comment:'Comments',watch:'Watch time',visits:'Profile visits'};
const dt=t=>t?new Date(t).toLocaleString():'-',isDone=x=>x.smm?x.smm.status==='completed':(x.done||0)>=x.qty;
const tagH=x=>PRIOT.includes(x.type)?`<span class="tag">${I({normal:'user',premium:'star',ultra:'zap'}[x.tier]||'user')} ${TIER[x.tier]||'Normal'}</span>`:'';
const stH=x=>`<span class="st ${isDone(x)?'ok':''}">${isDone(x)?'Completed':'In progress'}</span>`;
const head=x=>`<div style="display:flex;gap:12px;align-items:center"><img class="av big" data-av="${esc(x.handle)}" src="/pic?o=${x.id}" alt="" loading="lazy"><div><b>${NMT[x.type]} · ${esc(x.handle)}</b><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${tagH(x)}${stH(x)}</div><div style="display:flex;gap:6px;margin-top:6px"><a class="b o sm" target="_blank" rel="noopener" href="${esc(prof(x))}">${I('user')} Open profile</a>${x.link?`<a class="b o sm" target="_blank" rel="noopener" href="${esc(x.link)}">${I('yt')} Open video</a>`:''}</div></div></div>`;
const avErr=el=>el.querySelectorAll('img[data-av]').forEach(im=>im.onerror=()=>{im.outerHTML='<span class="av big">'+esc(im.dataset.av.replace('@','').charAt(0).toUpperCase())+'</span>'});
const opt=(v,t,c)=>`<option value="${v}"${c===v?' selected':''}>${t}</option>`;
let tf={pr:'',ty:'',so:'prio'},sf={q:'',ty:''};
async function tasks(){
  const {tasks:all}=await A('admTasks'),base=all.filter(x=>!x.smm),WT={ultra:3,premium:2,normal:1};
  $('#ad').innerHTML=`<div class="card"><select id="fp">${opt('','All priorities',tf.pr)}${opt('normal','Normal',tf.pr)}${opt('premium','Premium',tf.pr)}${opt('ultra','Ultra premium',tf.pr)}</select><select id="ft">${opt('','All types',tf.ty)}${opt('fs','Followers / subscribers',tf.ty)}${opt('like','Likes',tf.ty)}${opt('views','Views',tf.ty)}${opt('comment','Comments',tf.ty)}${opt('watch','Watch time',tf.ty)}</select><select id="fo">${opt('prio','Sort: priority first',tf.so)}${opt('amt','Sort: amount high to low',tf.so)}</select></div><div id="tl"></div>`;
  const draw=()=>{
    const l=base.filter(x=>(!tf.pr||x.tier===tf.pr)&&(!tf.ty||(tf.ty==='fs'?['subscribe','follow'].includes(x.type):x.type===tf.ty)));
    l.sort((a,b)=>isDone(a)-isDone(b)||(tf.so==='amt'?(b.cost||0)-(a.cost||0):(WT[b.tier]-WT[a.tier]||(b.qty-(b.done||0))-(a.qty-(a.done||0)))));
    $('#tl').innerHTML=`<p class="m">${l.length} orders</p>`+(l.map(x=>`<div class="card">${head(x)}<p class="m">${x.platform} · ${x.cost} points${x.mins?' · '+x.mins+' min parts':''}</p><p><b>Delivered ${x.done||0}/${x.qty}</b></p><div style="display:flex;gap:8px"><input type="number" min="0" max="${x.qty}" value="${x.done||0}" data-i="${x.id}" style="margin:0;flex:1"><button data-s="${x.id}" style="width:auto;margin:0">Save</button></div>${isDone(x)?'':`<div style="margin-top:8px"><input placeholder="SMM order number" data-n="${x.id}"><input type="number" min="0" step="0.01" inputmode="decimal" placeholder="Amount spent on SMM (₹) – users cannot see this" data-sc="${x.id}"><button class="o" data-m="${x.id}">${I('share')} Shift to SMM</button></div>`}</div>`).join('')||'<p class="m">No orders.</p>');
    avErr($('#tl'));
    $('#tl').querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{try{await A('admSetDone',{id:b.dataset.s,done:$(`[data-i="${b.dataset.s}"]`).value});ok('Delivered amount updated.','Saved',tasks)}catch(e){fail(e)}});
    $('#tl').querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{const i=b.dataset.m;try{await A('admToSmm',{id:i,no:$(`[data-n="${i}"]`).value,cost:$(`[data-sc="${i}"]`).value});ok('Moved to the SMM tab. Normal users can no longer see it as a task.','Shifted',tasks)}catch(e){fail(e)}});
  };
  ['fp','ft','fo'].forEach(i=>$('#'+i).onchange=()=>{tf={pr:$('#fp').value,ty:$('#ft').value,so:$('#fo').value};draw()});
  draw();
}
async function smm(){
  $('#ad').innerHTML=`<div class="card"><input id="sq" placeholder="Search by order id or SMM order number" value="${esc(sf.q)}" autocapitalize="off"><select id="sc">${opt('','All categories',sf.ty)}${Object.entries(NMT).map(([k,n])=>opt(k,n,sf.ty)).join('')}</select><button id="ss">${I('search')} Search</button><p class="m">${sf.q?'Search results':'Showing orders that are not completed yet'}</p></div><div id="sl"><p class="m">Loading…</p></div>`;
  $('#ss').onclick=()=>{sf={q:$('#sq').value,ty:$('#sc').value};smm().catch(fail)};
  const {orders:l}=await A('admSmm',{q:sf.q,type:sf.ty});
  $('#sl').innerHTML=l.map(x=>`<div class="card">${head(x)}<p class="m">Order id: <b>${esc(x.id)}</b></p><p class="m">${x.platform} · ${x.cost} points · <b>You spent: ${x.smm.cost!=null?'₹'+x.smm.cost:'not entered'}</b></p><p><b>Delivered ${x.done||0}/${x.qty}</b></p><input data-no="${x.id}" value="${esc(x.smm.no||'')}" placeholder="SMM order number"><input type="number" min="0" step="0.01" inputmode="decimal" data-cost="${x.id}" value="${x.smm.cost!=null?x.smm.cost:''}" placeholder="Amount spent (₹) – users cannot see this"><select data-sv="${x.id}">${[['pending','Pending'],['in_progress','In progress'],['completed','Completed']].map(([v,n])=>opt(v,n,x.smm.status)).join('')}</select><button data-sb="${x.id}">Save</button></div>`).join('')||'<p class="m">No orders.</p>';
  avErr($('#sl'));
  $('#sl').querySelectorAll('[data-sb]').forEach(b=>b.onclick=async()=>{const i=b.dataset.sb;try{await A('admSmmEdit',{id:i,status:$(`[data-sv="${i}"]`).value,no:$(`[data-no="${i}"]`).value,cost:$(`[data-cost="${i}"]`).value});ok('Order updated.','Saved',smm)}catch(e){fail(e)}});
}
async function refills(){
  const {refills:l}=await A('admRefills'),RS={review:'In review',done:'Refilled',rejected:'Rejected'};
  $('#ad').innerHTML=l.map(x=>`<div class="card">${head(x)}<p class="m">Order id: <b>${esc(x.id)}</b></p><p class="m">User: ${esc(x.email||x.uid)}</p><p class="m">${x.platform} · ${NMT[x.type]} · ${TIER[x.tier]}</p><p class="m">Delivered ${x.done}/${x.qty}</p><p class="m">Ordered: ${dt(x.created)}<br>Completed: ${dt(x.completedAt)}<br>Refill requested: ${dt(x.at)}${x.completedAt?' ('+Math.floor((x.at-x.completedAt)/864e5)+' days after completion)':''}</p><p><span class="st ${x.status==='done'?'ok':''}">${RS[x.status]}</span></p>${x.note?`<p class="m">Note: ${esc(x.note)}</p>`:''}${x.status==='review'?`<button data-rd="${x.id}">${I('refresh')} Mark refilled</button><button class="o" data-rj="${x.id}">Reject</button>`:''}</div>`).join('')||'<p class="m">No refill requests yet.</p>';
  avErr($('#ad'));
  const go=async(id,st,m)=>{const n=await ask(m,'Add a note for your records (optional).','Note');if(n===null)return;try{await A('admRefillSet',{id,status:st,note:n});ok('Saved.','Done',refills)}catch(e){fail(e)}};
  $('#ad').querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>go(b.dataset.rd,'done','Mark as refilled?'));
  $('#ad').querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>go(b.dataset.rj,'rejected','Reject this refill?'));
}
let rf2='';
async function reports(){
  const {reports:all}=await A('admReports'),RL={open:'Open',processing:'In process',solved:'Solved'};
  const draw=()=>{
    const l=all.filter(x=>!rf2||x.status===rf2);
    $('#rl').innerHTML=`<p class="m">${l.length} report${l.length===1?'':'s'}</p>`+(l.map(x=>{const o=x.order,KV=(n,v)=>v?`<div class="kv"><span>${n}</span><b>${v}</b></div>`:'';
      return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="st ${x.status==='solved'?'ok':''}">${RL[x.status]}</span><span class="m">${dt(x.at)}</span></div>
      <p class="m" style="margin:.6em 0 0">From: <b>${esc(x.email||x.uid)}</b></p><div class="rp"><b>Report:</b> ${esc(x.comment)}</div>
      ${o?head(o)+`<div style="margin-top:8px">${KV('Order id',esc(o.id))}${KV('Platform',esc(o.platform))}${KV('Type',NMT[o.type]+(o.tier&&PRIOT.includes(o.type)?' · '+TIER[o.tier]:''))}${KV('Quantity',(o.done||0)+' / '+o.qty+(o.mins?' ('+o.mins+' min parts)':''))}${KV('Points used',o.cost)}${KV('Placed',dt(o.created))}${KV('Completed',o.completedAt?dt(o.completedAt):'')}${o.link?KV('Link',`<a href="${esc(o.link)}" target="_blank" rel="noopener">Open</a>`):''}${o.smm?KV('SMM order no.',esc(o.smm.no||'-'))+KV('SMM status',esc(o.smm.status))+KV('SMM spent',o.smm.cost!=null?'₹'+o.smm.cost:'not entered'):''}${o.refill?KV('Refill',esc(o.refill.status)):''}</div>`:'<p class="m">The order was deleted.</p>'}
      <input data-n="${x.id}" value="${esc(x.note||'')}" placeholder="Note the user can see (optional)">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="o" data-st="processing|${x.id}" style="flex:1">${I('clock')} In process</button><button data-st="solved|${x.id}" style="flex:1">${I('shield')} Solved</button>${x.status!=='open'?`<button class="o" data-st="open|${x.id}" style="flex:1">${I('refresh')} Reopen</button>`:''}</div>
      <button class="o" data-del="${x.id}">Delete report</button></div>`}).join('')||'<p class="m">No reports.</p>');
    avErr($('#rl'));
    $('#rl').querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{const [st,id]=b.dataset.st.split('|');try{await A('admReportSet',{id,status:st,note:$(`[data-n="${id}"]`).value});ok('Report updated. The user can see the new status.','Saved',reports)}catch(e){fail(e)}});
    $('#rl').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(await ask('Delete this report?','The user will no longer see it.')===null)return;try{await A('admReportDel',{id:b.dataset.del});ok('Report deleted.','Done',reports)}catch(e){fail(e)}});
  };
  $('#ad').innerHTML=`<div class="card"><select id="rfs">${opt('','All reports',rf2)}${opt('open','Open',rf2)}${opt('processing','In process',rf2)}${opt('solved','Solved',rf2)}</select></div><div id="rl"></div>`;
  $('#rfs').onchange=()=>{rf2=$('#rfs').value;draw()};draw();
}
const LG={
amazon:'<svg viewBox="0 0 120 48" role="img" aria-label="Amazon"><text x="60" y="27" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="27" fill="#111">amazon</text><path d="M24 34c22 9 52 8 70-3" fill="none" stroke="#f90" stroke-width="3.5" stroke-linecap="round"/><path d="M87 26l8 4-5 7" fill="none" stroke="#f90" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
gplay:'<svg viewBox="0 0 160 48" role="img" aria-label="Google Play"><g transform="translate(2,10)"><path d="M6 3L17 16L6 29z" fill="#00a0ff"/><path d="M6 3L22 12.9L17 16z" fill="#00e676"/><path d="M6 29L22 19.1L17 16z" fill="#ff3d00"/><path d="M22 12.9L27 16L22 19.1L17 16z" fill="#ffc400"/></g><text x="40" y="31" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#3c4043">Google Play</text></svg>',
upi:'<svg viewBox="0 0 96 48" role="img" aria-label="UPI"><text x="4" y="34" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-style="italic" font-size="32" fill="#000">UPI</text><path d="M70 10l10 14-10 14z" fill="#f97316"/><path d="M80 10l10 14-10 14z" fill="#16a34a"/></svg>'};
const RNM={amazon:'Amazon Gift Cards',gplay:'Google Play Gift Cards',upi:'UPI Cash'};
let OPEN=null,UF='pending';
const sheet=(html,bind)=>{const old=$('#osh');if(old)old.remove();const d=document.createElement('div');d.className='sheet';d.id='osh';d.innerHTML=`<div role="dialog">${html}</div>`;
  d.onclick=e=>{if(e.target===d||e.target.closest('[data-x]')){OPEN=null;d.remove()}};document.body.append(d);bind&&bind(d);return d};
const closeBtn=`<button class="o sm" data-x aria-label="Close">${I('out')} Close</button>`;
async function rewards(){
  const [{items:l,upi},rv]=await Promise.all([A('admItems'),A('admRevenue')]),rb=rv.rewardsBy;
  const pend=upi.filter(x=>x.status==='pending'),pendRs=pend.reduce((a,x)=>a+(x.rs||0),0);
  const go=async(a,x,m)=>{try{await A(a,x);ok(m,'Done',rewards)}catch(e){/^Admin session/.test(e.message)?fail(e):say(e.message,'Could not save')}};
  const cards=['amazon','gplay','upi'].map(ty=>{const it=l.filter(x=>x.type===ty),st=it.reduce((a,x)=>a+(x.stock||0),0);
    return `<button type="button" class="cat ${ty}" data-c="${ty}"><span class="logo">${LG[ty]}</span><b class="ct">${RNM[ty]}</b><span class="cav ${st>0?'':'n'}">${st>0?st+' in stock':'Out of stock'}</span><span class="cm">${it.length} reward${it.length===1?'':'s'} · ₹${rb[ty]} given</span><span class="cg">Tap to manage ${I('up')}</span></button>`}).join('')
   +`<button type="button" class="cat req" data-c="req"><span class="big-ic">${I('wallet')}</span><b class="ct">UPI requests</b><span class="cav ${pend.length?'n':''}">${pend.length?pend.length+' pending · ₹'+pendRs:'No pending requests'}</span><span class="cm">${upi.length} total requests</span><span class="cg">Tap to manage ${I('up')}</span></button>`;
  $('#ad').innerHTML=`<div class="cats c4">${cards}</div>
  <div class="card"><b>${I('gift')} Money given as rewards</b><div class="kv"><span>Total</span><b>₹${rv.rewards.all}</b></div><div class="kv"><span>Today / this month</span><b>₹${rv.rewards.today} / ₹${rv.rewards.month}</b></div></div>
  <div class="card"><b>${I('bell')} Tell users about a restock</b><p class="m">After adding codes or stock, send a push from your LumaPush dashboard.</p><textarea id="rsm" rows="2">Rewards restocked! Amazon, Google Play and UPI rewards are available again. Redeem now.</textarea><button id="rsc" class="o">${I('copy')} Copy message</button><a class="b" href="https://lumapush.com/dashboard" target="_blank" rel="noopener">${I('share')} Open LumaPush</a></div>`;
  $('#rsc').onclick=()=>navigator.clipboard.writeText($('#rsm').value).then(()=>ok('Message copied. Paste it in LumaPush.','Copied')).catch(()=>say('Press and hold the text to copy it.'));

  const catSheet=ty=>{OPEN=ty;const it=l.filter(x=>x.type===ty).sort((a,b)=>a.rs-b.rs);
    sheet(`<div class="sh"><span class="logo" style="height:56px">${LG[ty]}</span><h2>${RNM[ty]}</h2>${closeBtn}</div>
    <div class="card"><b>${I('gift')} Add a reward</b><input id="nr" type="number" inputmode="numeric" placeholder="Amount in ₹"><input id="np" type="number" inputmode="numeric" placeholder="Points needed">${ty==='upi'?'<input id="ns" type="number" inputmode="numeric" placeholder="Stock (how many withdrawals)">':''}<button id="na">Add reward</button></div>`
    +(it.map(x=>`<div class="card"><b>₹${x.rs}</b> <span class="cav ${x.stock>0?'':'n'}">${x.stock>0?x.stock+' in stock':'Out of stock'}</span><p class="m">${x.pts} points</p><input type="number" value="${x.rs}" data-r="${x.id}" placeholder="Amount ₹"><input type="number" value="${x.pts}" data-p="${x.id}" placeholder="Points">${ty==='upi'?`<input type="number" value="${x.stock||0}" data-k="${x.id}" placeholder="Stock">`:`<textarea data-c="${x.id}" rows="3" placeholder="Gift codes, one per line" ${ta}></textarea><button class="o" data-ac="${x.id}">${I('gift')} Add codes</button>`}<button data-sv="${x.id}">Save changes</button><button class="o" data-dl="${x.id}">Delete reward</button></div>`).join('')||'<p class="m">No rewards here yet. Add one above.</p>'),
    d=>{const v=(q,i)=>d.querySelector(`[data-${q}="${i}"]`);
      d.querySelector('#na').onclick=()=>go('admAddItem',{type:ty,rs:d.querySelector('#nr').value,pts:d.querySelector('#np').value,stock:ty==='upi'?(d.querySelector('#ns').value||0):0},'Reward added.');
      d.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>go('admAddCodes',{id:b.dataset.ac,codes:v('c',b.dataset.ac).value},'Codes added to stock. Now send a restock notification with the LumaPush card.'));
      d.querySelectorAll('[data-sv]').forEach(b=>{const i=b.dataset.sv;b.onclick=()=>go('admSetItem',{id:i,rs:v('r',i).value,pts:v('p',i).value,stock:v('k',i)?v('k',i).value:0},'Changes saved.')});
      d.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{if(await ask('Delete this reward?','Its codes and stock will be removed.')!==null)go('admDelItem',{id:b.dataset.dl},'Reward deleted.')})})};

  const reqSheet=()=>{OPEN='req';
    sheet(`<div class="sh"><span class="big-ic">${I('wallet')}</span><h2>UPI requests</h2>${closeBtn}</div><div class="chips" id="uf"></div><div id="ul"></div>`,d=>{
      const draw=()=>{
        const cnt=k=>k==='all'?upi.length:upi.filter(x=>x.status===k).length;
        d.querySelector('#uf').innerHTML=[['pending','Pending'],['paid','Approved'],['cancelled','Cancelled'],['all','All']].map(([k,n])=>`<button type="button" class="${k===UF?'':'o'}" data-f="${k}">${n} (${cnt(k)})</button>`).join('');
        const rank={pending:0,paid:1,cancelled:1},rows=upi.filter(x=>UF==='all'||x.status===UF).sort((a,b)=>(rank[a.status]-rank[b.status])||(a.status==='pending'?a.at-b.at:b.at-a.at));
        d.querySelector('#ul').innerHTML=rows.map(x=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:1.8rem;font-weight:800">₹${x.rs}</span>${x.status==='paid'?'<span class="st ok">Approved</span>':x.status==='cancelled'?'<span class="st" style="border-color:#991b1b;color:#991b1b">Cancelled · refunded</span>':'<span class="st">Pending</span>'}</div>
          <div class="kv"><span>UPI ID</span><b style="font-size:1.1rem">${esc(x.upi)}</b></div><button class="o sm" data-cp="${esc(x.upi)}">${I('copy')} Copy UPI ID</button>
          <p class="m" style="margin:.5em 0 0">${x.pts} points · ${esc(x.email||'Guest '+String(x.uid||'').slice(0,10))}<br>${dt(x.at)}${x.note?'<br>Note: '+esc(x.note):''}</p>
          ${x.status==='pending'?`<div style="display:flex;gap:8px;margin-top:8px"><button data-up="${x.rid}" style="flex:1">${I('shield')} Approve</button><button class="o" data-uc="${x.rid}" style="flex:1">Cancel + refund</button></div>`:''}</div>`).join('')||'<p class="m">Nothing here.</p>';
        d.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{UF=b.dataset.f;draw()});
        d.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.cp).then(()=>ok('UPI ID copied.','Copied')).catch(()=>say('Press and hold the UPI ID to copy it.')));
        d.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{if(await ask('Approve this withdrawal?','Only approve after you have paid the money to the UPI ID.')!==null)go('admUpiSet',{id:b.dataset.up,status:'paid'},'Approved.')});
        d.querySelectorAll('[data-uc]').forEach(b=>b.onclick=async()=>{const n=await ask('Cancel this withdrawal?','The points will be refunded to the user. Add a reason the user can see (optional).','Reason');if(n===null)return;go('admUpiSet',{id:b.dataset.uc,status:'cancelled',note:n},'Cancelled. The points were refunded to the user.')});
      };draw()})};

  $('#ad').querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>c.dataset.c==='req'?reqSheet():catSheet(c.dataset.c));
  if(OPEN)OPEN==='req'?reqSheet():catSheet(OPEN);                    // keep the popup open after saving
}
async function users(){
  $('#ad').innerHTML=`<div class="card"><input id="q" placeholder="Search by email or name"><button id="qs">Search</button></div><div id="ul"></div>`;
  const go=async()=>{const {users:l}=await A('admUsers',{q:$('#q').value});$('#ul').innerHTML=l.map(x=>`<div class="row"><span>${esc(x.email||'(guest)')}<br><span class="m">${esc(x.name||'')} · ${x.guest?'guest':'Google'} · spent ${x.spent||0}</span></span><b>${x.points||0}</b></div>`).join('')||'<p class="m">No users found.</p>'};
  $('#qs').onclick=()=>go().catch(fail);go().catch(fail);
}
async function revenue(){
  const r=await A('admRevenue'),P=[['today','Today'],['week','Last 7 days'],['month','This month'],['year','This year'],['all','All time']];
  const net=k=>Math.round((r.received[k]-r.smm[k]-r.rewards[k])*100)/100,col=v=>v<0?'#dc2626':'#16a34a';
  const blk=([k,n])=>`<div class="card"><b>${n}</b>
    <div class="kv"><span>${I('wallet')} Money received (points bought)</span><b>₹${r.received[k]}</b></div>
    <div class="kv"><span>${I('coin')} Points sold</span><b>${r.points[k]}</b></div>
    <div class="kv"><span>${I('share')} Spent on SMM</span><b>₹${r.smm[k]}</b></div>
    <div class="kv"><span>${I('gift')} Given as rewards</span><b>₹${r.rewards[k]}</b></div>
    <div class="kv"><span><b>Net profit</b></span><b style="font-size:1.3rem;color:${col(net(k))}">₹${net(k)}</b></div></div>`;
  $('#ad').innerHTML=P.map(blk).join('')+`<h1>By month</h1>`+(r.months.map(x=>{const n=Math.round((x.got-x.smm-x.rew)*100)/100;return `<div class="card"><b>${x.m}</b><div class="kv"><span>Received</span><b>₹${x.got}</b></div><div class="kv"><span>Points sold</span><b>${x.pts}</b></div><div class="kv"><span>SMM spent</span><b>₹${x.smm}</b></div><div class="kv"><span>Rewards given</span><b>₹${x.rew}</b></div><div class="kv"><span>Net profit</span><b style="color:${col(n)}">₹${n}</b></div></div>`}).join('')||'<p class="m">No payments yet.</p>')+`<p class="m">Net profit = money received − SMM spent − rewards given. SMM amounts count from when you enter them. Reward value is the ₹ face value of each reward.</p>`;
}
let PV='overview',PTS='';
async function premium(){
  const [r,tk]=await Promise.all([A('admPmOverview'),A('admPmTickets')]),tickets=tk.tickets;
  const P=[['today','Today'],['week','Last 7 days'],['month','This month'],['year','This year'],['all','All time']],TL={open:'Open',processing:'In process',solved:'Solved'};
  const openT=tickets.filter(x=>x.status!=='solved').length,conf=r.confirming.length;
  const warn=(r.err?`<div class="card" style="border-color:#dc2626"><b>${I('info')} Booster service problem</b><p class="m">${esc(r.err)}</p><p class="m">Check that SMM_API_KEY is set in Netlify, then tap Refresh services.</p></div>`:'')
    +(r.panel&&!r.panel.mult?`<div class="card" style="border-color:#dc2626"><b>${I('info')} Panel currency is ${esc(r.panel.cur||'unknown')}, not INR</b><p class="m">Selling is paused. Add SMM_RATE_MULT in Netlify (rupees per 1 ${esc(r.panel.cur||'unit')}), then tap Refresh services.</p></div>`:'')
    +(r.alert?`<div class="card" style="border-color:#d97706"><b>${I('info')} ${esc(r.alert.msg)}</b><p class="m">${dt(r.alert.at)}. Top up your panel balance, then tap Refresh services to clear this.</p></div>`:'');
  const stat=([k,n])=>`<div class="card"><b>${n}</b><div class="kv"><span>Wallet top-ups</span><b>₹${r.topups[k]}</b></div><div class="kv"><span>Sales (orders)</span><b>₹${r.sales[k]}</b></div><div class="kv"><span>Panel cost</span><b>₹${r.cost[k]}</b></div><div class="kv"><span><b>Profit</b></span><b style="font-size:1.2rem;color:${r.profit[k]<0?'#dc2626':'#16a34a'}">₹${r.profit[k]}</b></div></div>`;
  const orderCard=o=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="st ${/^completed/i.test(o.status)?'ok':''}">${o.review?'Confirming (check panel)':esc(o.status)}</span><span class="m">${dt(o.created)}</span></div><p style="margin:.5em 0 0"><b>${esc(o.name)}</b></p><p class="m" style="margin:0;word-break:break-all">${esc(o.p)} · ${esc(o.link)}</p><p class="m" style="margin:.3em 0">${esc(o.email||o.uid)} · Qty ${o.qty} · ${o.panel?'Panel order #'+esc(o.panel):'No panel order number'}</p><div class="kv"><span>Charged</span><b>₹${o.price}</b></div><div class="kv"><span>Panel cost</span><b>₹${o.cost}</b></div>${o.refunded>0?`<div class="kv"><span>Refunded</span><b>₹${o.refunded}</b></div>`:''}${o.refunded<o.price?`<button class="o" data-rf="${o.uid}|${o.id}">Refund to wallet</button>`:''}</div>`;
  const tCard=x=>{const o=x.order,KV=(n,v)=>v?`<div class="kv"><span>${n}</span><b>${v}</b></div>`:'';
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="st ${x.status==='solved'?'ok':''}">${TL[x.status]}</span><span class="m">${dt(x.at)}</span></div><p class="m" style="margin:.6em 0 0">From: <b>${esc(x.email||x.uid)}</b></p><div class="rp"><b>Ticket:</b> ${esc(x.msg)}</div>${o?`<div>${KV('Service',esc(o.name))}${KV('Platform',esc(o.p))}${KV('Panel order no.',esc(o.panel||'-'))}${KV('Link',esc(o.link))}${KV('Quantity',o.qty)}${KV('Paid','₹'+o.price)}${KV('Status',esc(o.status))}</div>`:'<p class="m">General ticket (no order).</p>'}<input data-n="${x.id}" value="${esc(x.note||'')}" placeholder="Reply the user can see (optional)"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="o" data-st="processing|${x.id}" style="flex:1">In process</button><button data-st="solved|${x.id}" style="flex:1">Solved</button>${x.status!=='open'?`<button class="o" data-st="open|${x.id}" style="flex:1">Reopen</button>`:''}</div><button class="o" data-del="${x.id}">Delete ticket</button></div>`};
  const body=PV==='overview'?`<div class="card"><b>${I('wallet')} Booster service (panel)</b>${r.panel?`<div class="kv"><span>Panel balance</span><b>${esc(r.panel.cur)} ${r.panel.bal}</b></div>`:''}<div class="kv"><span>Users' wallet money</span><b>₹${r.wallets}</b></div><button id="prf" class="o">${I('refresh')} Refresh services and prices</button><p class="m">Prices shown to users are the panel price plus 10%. Users never see the panel price.</p></div>`+P.map(stat).join('')
   :PV==='orders'?(r.orders.map(orderCard).join('')||'<p class="m">No orders yet.</p>')
   :`<div class="card"><select id="tfs">${opt('','All tickets',PTS)}${opt('open','Open',PTS)}${opt('processing','In process',PTS)}${opt('solved','Solved',PTS)}</select></div>`+(tickets.filter(x=>!PTS||x.status===PTS).map(tCard).join('')||'<p class="m">No tickets.</p>');
  $('#ad').innerHTML=warn+`<div class="chips" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">${[['overview','Overview',0],['orders','Orders',conf],['tickets','Tickets',openT]].map(([k,n,c])=>`<button type="button" class="${k===PV?'':'o'}" data-pv="${k}" style="width:auto;margin:0">${n}${c?` (${c})`:''}</button>`).join('')}</div>`+body;
  const re=()=>premium();
  document.querySelectorAll('#ad [data-pv]').forEach(b=>b.onclick=()=>{PV=b.dataset.pv;re()});
  if($('#tfs'))$('#tfs').onchange=()=>{PTS=$('#tfs').value;re()};
  if($('#prf'))$('#prf').onclick=async()=>{const b=$('#prf');b.disabled=true;try{await A('admPmRefresh');ok('Services and prices refreshed.','Done',re)}catch(e){say(e.message,'Could not refresh');b.disabled=false}};
  document.querySelectorAll('#ad [data-rf]').forEach(b=>b.onclick=async()=>{if(await ask('Refund this order?','The charged amount goes back to the user\'s wallet.')===null)return;const [uid,id]=b.dataset.rf.split('|');try{const x=await A('admPmRefund',{uid,id});ok('Refunded ₹'+x.refunded+' to the wallet.','Done',re)}catch(e){say(e.message,'Could not refund')}});
  document.querySelectorAll('#ad [data-st]').forEach(b=>b.onclick=async()=>{const [st,id]=b.dataset.st.split('|');try{await A('admPmTicketSet',{id,status:st,note:$(`[data-n="${id}"]`).value});ok('Ticket updated.','Saved',re)}catch(e){say(e.message)}});
  document.querySelectorAll('#ad [data-del]').forEach(b=>b.onclick=async()=>{if(await ask('Delete this ticket?','The user will no longer see it.')===null)return;try{await A('admPmTicketDel',{id:b.dataset.del});ok('Ticket deleted.','Done',re)}catch(e){say(e.message)}});
}
async function settings(){
  const {admins:l,fixed:f}=await A('admAdmins');
  $('#ad').innerHTML=`<div class="card"><b>Admin Google accounts</b><p class="m">Only these accounts can open this panel.</p>${f.map(e=>`<div class="row"><span>${esc(e)}</span><span class="m">Netlify variable</span></div>`).join('')}${l.map(x=>`<div class="row"><span>${esc(x.email)}</span><button class="o" data-d="${x.key}">Remove</button></div>`).join('')}</div><div class="card"><input id="ae" type="email" placeholder="Add an admin Gmail address" autocapitalize="off"><button id="aa">Add admin</button></div>`;
  $('#aa').onclick=async()=>{try{await A('admAddAdmin',{email:$('#ae').value});ok('Admin added.','Saved',settings)}catch(e){fail(e)}};
  $('#ad').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(await ask('Remove this admin?','They will no longer be able to open the panel.')===null)return;try{await A('admDelAdmin',{key:b.dataset.d});ok('Admin removed.','Done',settings)}catch(e){fail(e)}});
}
tk()?panel():login();
</script></body></html>
