<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buy points – FollowPay</title><meta name="description" content="Earn points by subscribing, following and liking. Spend them to grow your own YouTube channel or Instagram profile."><meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<style>*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#000}
header{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto;padding:16px;border-bottom:2px solid #000}
header b{font-size:1.25rem;letter-spacing:-.02em}
nav{display:flex;gap:4px;max-width:520px;margin:0 auto;padding:10px 16px 0}
nav a{flex:1;text-align:center;padding:8px 2px;border:2px solid #000;border-radius:6px;color:#000;text-decoration:none;font-weight:600;font-size:.8rem}
nav a.on{background:#000;color:#fff}
main{max-width:520px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:1.5rem;line-height:1.15;margin:.4em 0;letter-spacing:-.02em}
.card{border:2px solid #000;border-radius:6px;padding:16px;margin:16px 0}
button,a.b{display:block;font:inherit;font-weight:600;width:100%;padding:13px 16px;margin:6px 0;border:2px solid #000;border-radius:6px;background:#000;color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.o{background:#fff!important;color:#000!important}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #000;outline-offset:2px}
input,select{font:inherit;width:100%;padding:12px;margin:6px 0;border:2px solid #000;border-radius:6px;background:#fff;color:#000}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #000}
.row button{width:auto;margin:0;padding:6px 12px}
.m{color:#555;font-size:.9rem;margin:.4em 0}
#msg{border:2px solid #000;border-radius:6px;padding:12px;margin:12px 0;font-weight:600}</style></head>
<body data-page="buy">
<header><b>FollowPay</b><span id="pts"></span></header><nav><a href="home.html">Home</a><a href="earn.html">Earn</a><a href="boost.html">Boost</a><a href="buy.html" class=on>Buy</a><a href="profiles.html">Profiles</a></nav>
<main><div id="msg" hidden></div>
<h1>Buy points</h1><div class="card" id="packs"></div><div class="card" id="pay" hidden></div><h1>Transactions</h1><div id="tx"></div>
</main>
<script type="module">
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=m=>{const e=$('#msg');e.textContent=m||'';e.hidden=!m};
const PL={youtube:'YouTube',instagram:'Instagram'};
const tok=localStorage.getItem('fp_t'),page=document.body.dataset.page,plat=sessionStorage.getItem('plat');
if(!tok||tok==='undefined'){location.href='index.html';throw 0}
if(!plat&&!['home','buy','profiles'].includes(page)){location.href='home.html';throw 0}
const setPts=n=>{localStorage.setItem('fp_p',n);$('#pts').textContent=n+' points'};
if(localStorage.getItem('fp_p'))$('#pts').textContent=localStorage.getItem('fp_p')+' points';
async function api(action,x={}){
  let r,j;
  try{r=await fetch('/api',{method:'POST',body:JSON.stringify({action,token:tok,...x})});j=await r.json()}catch(e){throw new Error('Cannot reach the server. Check your internet.')}
  if(r.status===401){localStorage.removeItem('fp_t');location.href='index.html';throw new Error('Please sign in again')}
  if(!r.ok)throw new Error(j.error||'Server error');
  return j;
}
const start=async()=>{try{const r=await api('me');setPts(r.user.points);return r}catch(e){say(e.message);throw e}};
const logout=()=>{localStorage.removeItem('fp_t');localStorage.removeItem('fp_p');sessionStorage.clear();location.href='index.html'};
const PACKS=[[1,10],[20,70],[30,130],[50,300],[100,1000]];
$('#packs').innerHTML=PACKS.map(([rs,pt],i)=>`<button class="o" data-k="${i}">₹${rs} → ${pt} points</button>`).join('');
let cur=null,iv=null,n=0;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function check(id,quiet){
  try{const r=await api('check',{orderId:id});
    if(r.status==='PAID'){clearInterval(iv);if(r.points!=null)setPts(r.points);if($('#ps')&&cur&&cur.id===id)$('#ps').textContent='Payment received. Points added.';loadTx();return true}
    if(r.status==='EXPIRED'){clearInterval(iv);if($('#ps'))$('#ps').textContent='This order expired. Create a new one.';loadTx()}
    else if(!quiet)say('Payment not received yet.');
  }catch(e){if(!quiet)say(e.message)}
}
function show(o){
  cur=o;clearInterval(iv);say('');const el=$('#pay');el.hidden=false;
  el.innerHTML=`<b>Pay exactly ₹${o.amount}</b><p class="m">Order ${esc(o.id)} · ${o.pts} points · <span id="tm"></span></p><img src="${esc(o.qr)}" alt="UPI QR code" width="220" height="220" style="display:block;margin:8px auto;max-width:100%"><a class="b" href="${esc((o.intent&&o.intent.phonepe)||o.url)}">Pay with PhonePe</a><a class="b o" href="${esc((o.intent&&o.intent.paytm)||o.url)}">Pay with Paytm</a><p class="m" id="ps">Waiting for payment…</p>`;
  n=0;iv=setInterval(()=>{n++;const left=Math.max(0,Math.round((o.exp-Date.now())/1000));$('#tm').textContent=fmt(left);if(n%3===0)check(o.id,true);if(left<=0&&n%3===0)clearInterval(iv)},1000);
  el.scrollIntoView({behavior:'smooth'});
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{show(await api('buy',{pack:+b.dataset.k}));loadTx()}catch(e){say(e.message)}b.disabled=false});
async function loadTx(){
  try{const {txs}=await api('txs'),now=Date.now();
    $('#tx').innerHTML=txs.map(x=>{const live=x.status==='PENDING'&&now<x.exp+60000;
      return `<div class="row"><span>₹${x.rs} · ${x.pts} pts<br><span class="m">${new Date(x.created).toLocaleString()}</span></span><span>${live?`<button data-c="${esc(x.id)}">Verify</button>`:x.status==='PENDING'?'EXPIRED':x.status}</span></div>`}).join('')||'<p class="m">No transactions yet.</p>';
    $('#tx').querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const x=txs.find(t=>t.id===b.dataset.c);if(await check(x.id,false)!==true&&x.exp>Date.now())show(x)});
  }catch(e){say(e.message)}
}
start().catch(()=>{});loadTx();
</script></body></html>
