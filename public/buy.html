<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buy points – FollowPay</title><meta name="description" content="Earn points by subscribing, following and liking. Spend them to grow your own YouTube channel or Instagram profile."><meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/core.css?v=23"></head>
<body data-page="buy">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></symbol><symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.8c0-1.2 1-1.8 2.5-1.8s2.5.7 2.5 1.8c0 2.4-5 1.2-5 3.8 0 1.2 1 1.9 2.5 1.9s2.5-.6 2.5-1.9"/></symbol><symbol id="i-boost" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol><symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8C9 8 8 4.5 10 4s2 4 2 4zM12 8c3 0 4-3.5 2-4s-2 4-2 4z"/></symbol><symbol id="i-yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></symbol><symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol><symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/></symbol><symbol id="i-follow" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8h16v-8M12 15V3M8 7l4-4 4 4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol><symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol></defs></svg><header><b><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> FollowPay</b><span class="pill" id="pw" hidden><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span id="pts"></span></span></header><nav><a href="home.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a><a href="earn.html"><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span>Earn</span></a><a href="boost.html"><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg><span>Boost</span></a><a href="buy.html" class=on><svg class="ic" aria-hidden="true"><use href="#i-wallet"/></svg><span>Buy</span></a><a href="store.html"><svg class="ic" aria-hidden="true"><use href="#i-gift"/></svg><span>Rewards</span></a><a href="refer.html"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg><span>Refer</span></a><a href="profiles.html"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a></nav>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<h1>Buy points</h1><p class="m">Tap a pack, then scan the QR with any UPI app.</p><div class="packs" id="packs"></div><h1>Transactions</h1><div id="tx"></div>
</main>
<script type="module">
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(m,t,cb)=>{if(!m)return;const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" role="alertdialog"><b>${esc(t||'Notice')}</b><p>${esc(m)}</p><button>OK</button></div>`;d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON'){d.remove();cb&&cb()}};document.body.append(d)};
const ok=(m,t,cb)=>say(m,t||'Done',cb);
const ask=(t,m,ph)=>new Promise(res=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" role="dialog"><b>${esc(t)}</b><p>${esc(m)}</p>${ph?`<input placeholder="${esc(ph)}" autocapitalize="off" autocomplete="off">`:''}<button>Confirm</button><button class="o" style="margin-top:8px">Cancel</button></div>`;document.body.append(d);const i=d.querySelector('input'),[c,x]=d.querySelectorAll('button');c.onclick=()=>{d.remove();res(i?i.value:'')};x.onclick=()=>{d.remove();res(null)}});
const PL={youtube:'YouTube',instagram:'Instagram'};
const tok=localStorage.getItem('fp_t'),page=document.body.dataset.page,plat=sessionStorage.getItem('plat');
if((!tok||tok==='undefined')&&page!=='admin'){location.href='index.html';throw 0}
if(!plat&&!['home','buy','profiles','refer','store','admin'].includes(page)){location.href='home.html';throw 0}
const setPts=n=>{localStorage.setItem('fp_p',n);$('#pts').textContent=n;$('#pw').hidden=false};
if(localStorage.getItem('fp_p')){$('#pts').textContent=localStorage.getItem('fp_p');$('#pw').hidden=false}
async function api0(action,x={}){
  let r,j;
  try{r=await fetch('/api',{method:'POST',body:JSON.stringify({action,token:tok,...x})});j=await r.json()}catch(e){throw new Error('Cannot reach the server. Check your internet.')}
  if(r.status===401){localStorage.removeItem('fp_t');location.href='index.html';throw new Error('Please sign in again')}
  if(!r.ok)throw new Error(j.error||'Server error');
  return j;
}
let fly=0;
const hideLd=()=>{const l=$('#ld');if(l)l.remove()};
async function api(a,x){fly++;try{return await api0(a,x)}finally{if(--fly===0)setTimeout(hideLd,60)}}
setTimeout(hideLd,10000);
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(a&&/\.html/.test(a.getAttribute('href')))document.body.classList.add('go')});
addEventListener('pageshow',()=>document.body.classList.remove('go'));
const start=async()=>{try{const r=await api('me');setPts(r.user.points);
  const c=localStorage.getItem('fp_ref');if(c&&!r.user.refBy&&!(r.user.spent>0))api('useRef',{code:c}).catch(()=>{}).finally(()=>localStorage.removeItem('fp_ref'));
  return r}catch(e){say(e.message);throw e}};
const logout=()=>{localStorage.removeItem('fp_t');localStorage.removeItem('fp_p');sessionStorage.clear();location.href='index.html'};
const I=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const CFG={apiKey:"AIzaSyBxl8tOaw6eJpRbl4Elx5YGvfaWGbry-_g",authDomain:"followpay-a7dfe.firebaseapp.com",projectId:"followpay-a7dfe",appId:"1:361285479601:web:3725e5d93893022b8dc690"};
async function upgrade(){
  try{const V='https://www.gstatic.com/firebasejs/10.12.2/',[A,B]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js')]);
    const c=await B.signInWithPopup(B.getAuth(A.initializeApp(CFG)),new B.GoogleAuthProvider());
    await api('linkGoogle',{idToken:await c.user.getIdToken()});
    ok('Your account is now linked to Google. You can sign in with Google any time.','Account upgraded',()=>location.reload());
  }catch(e){say(e.code==='auth/popup-closed-by-user'?'Sign-in window was closed.':e.code==='auth/unauthorized-domain'?'Add folowpay.netlify.app in Firebase authorized domains.':e.message,'Could not upgrade')}
}
const PACKS=[[1,2],[2,6],[10,35],[20,74],[50,180],[80,280],[135,500],[300,1000]];
$('#packs').innerHTML=PACKS.map(([rs,pt],i)=>`<button class="o pk" data-k="${i}"><span class="pkc">${I('coin')}</span><span class="pkp">${pt}</span><span class="pkl">points</span><span class="pkr">Pay ₹${rs}</span></button>`).join('');
let iv=null,busy=false;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const UPI='<svg width="96" height="40" viewBox="0 0 96 40" role="img" aria-label="UPI"><text x="4" y="30" font-family="system-ui,Arial,sans-serif" font-weight="800" font-style="italic" font-size="30" fill="#000">UPI</text><path d="M70 8l10 12-10 12z" fill="#f97316"/><path d="M80 8l10 12-10 12z" fill="#16a34a"/></svg>';
const closeFull=()=>{clearInterval(iv);const f=$('#full');if(f)f.remove()};
const success=n=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" style="text-align:center" role="alertdialog"><svg class="okc" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none"/><path fill="none" d="M14 27l8 8 16-17"/></svg><b>Payment successful</b><p>+${n} points added to your account</p><button>Done</button></div>`;d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON')d.remove()};document.body.append(d)};
async function check(id){
  try{const r=await api('check',{orderId:id});
    if(r.status==='PAID'){closeFull();if(r.points!=null)setPts(r.points);if(r.pts)success(r.pts);loadTx();return true}
    if(r.status==='EXPIRED'){closeFull();loadTx();say('Payment time ended. If you already paid, check Transactions.','Time is up')}
  }catch(e){}
  return false;
}
function show(o){
  closeFull();const f=document.createElement('div');f.className='full';f.id='full';
  f.innerHTML=`<div class="fin">${UPI}<h1>Pay ₹${esc(o.amount)}</h1><p class="m">Scan with any UPI app and pay the exact amount.</p><img class="qr" src="${esc(o.qr)}" alt="UPI QR code"><p class="m">Order ${esc(o.id)} · ${o.pts} points</p><p><b id="tm"></b></p><p class="m">Waiting for payment… this screen updates by itself.</p><button id="cn" class="o">Cancel</button></div>`;
  document.body.append(f);
  iv=setInterval(()=>{const left=Math.max(0,Math.round((o.exp-Date.now())/1000));$('#tm').textContent=fmt(left);
    if(left<=0){closeFull();loadTx();say('Payment time ended. If you already paid, tap Check payment under Transactions.','Time is up');return}
    if(!busy){busy=true;check(o.id).finally(()=>busy=false)}},1000);
  $('#cn').onclick=async()=>{const b=$('#cn');b.disabled=true;b.textContent='Cancelling…';clearInterval(iv);
    try{const r=await api('cancel',{orderId:o.id});if(r.status==='PAID'){if(r.points!=null)setPts(r.points);if(r.pts)success(r.pts)}}catch(e){}
    closeFull();loadTx()};
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{show(await api('buy',{pack:+b.dataset.k}));loadTx()}catch(e){say(e.message,'Could not create order')}b.disabled=false});
async function loadTx(){
  try{const {txs}=await api('txs'),now=Date.now();
    const list=txs.filter(x=>x.status==='PAID'||(x.status==='PENDING'&&now<x.exp+60000));
    $('#tx').innerHTML=list.map(x=>`<div class="row"><span>₹${x.rs} · ${x.pts} pts<br><span class="m">${new Date(x.created).toLocaleString()}</span></span><span>${x.status==='PAID'?'<b style="color:#16a34a">✓ Paid</b>':`<button data-c="${esc(x.id)}">Check payment</button>`}</span></div>`).join('')||'<p class="m">No transactions yet.</p>';
    $('#tx').querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const x=list.find(t=>t.id===b.dataset.c);if(await check(x.id)!==true&&x.exp>Date.now())show(x)});
  }catch(e){say(e.message)}
}
start().then(r=>{if(r.user.guest)$('#packs').insertAdjacentHTML('beforebegin',`<div class="card gw" role="note"><span class="big-ic">${I('info')}</span><div><b>You are using a guest account</b><p class="m" style="margin:.2em 0 0;color:#78350f">If you clear your browser data, your account data will be lost. <a href="refer.html">Save your account</a></p></div></div>`)}).catch(()=>{});
loadTx();
</script></body></html>
