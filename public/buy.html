<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buy points – FollowPay</title><meta name="description" content="Earn points by subscribing, following and liking. Spend them to grow your own YouTube channel or Instagram profile."><meta name="robots" content="noindex">
<link rel="icon" href="/logo.png">
<style>*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#000}
header{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto;padding:16px;border-bottom:2px solid #000}
header b{font-size:1.25rem;letter-spacing:-.02em}
nav{display:flex;gap:4px;max-width:520px;margin:0 auto;padding:10px 16px 0}
nav a{flex:1;text-align:center;padding:8px 2px;border:2px solid #000;border-radius:6px;color:#000;text-decoration:none;font-weight:600;font-size:.8rem}
nav a.on{background:#000;color:#fff}
main{max-width:520px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:1.5rem;line-height:1.15;margin:.4em 0;letter-spacing:-.02em}
.card{border:2px solid #000;border-radius:6px;padding:16px;margin:16px 0}
button,a.b{display:block;font:inherit;font-weight:600;width:100%;padding:13px 16px;margin:6px 0;border:2px solid #000;border-radius:6px;background:#000;color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.o{background:#fff!important;color:#000!important}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #000;outline-offset:2px}
input,select{font:inherit;width:100%;padding:12px;margin:6px 0;border:2px solid #000;border-radius:6px;background:#fff;color:#000}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #000}
.row button{width:auto;margin:0;padding:6px 12px}
.m{color:#555;font-size:.9rem;margin:.4em 0}
.tabs{display:flex;gap:6px}.tabs button{margin:6px 0;padding:10px 6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.pop{background:#fff;border:2px solid #000;border-radius:6px;padding:20px;max-width:360px;width:100%}
.pop b{font-size:1.2rem}.pop p{margin:.6em 0 1em}.pop button{margin:0}
.tick{width:72px;height:72px;margin:0 auto 12px;border:3px solid #000;border-radius:50%;font-size:2.4rem;line-height:66px;animation:pp .4s ease-out}
@keyframes pp{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.full{position:fixed;inset:0;background:#fff;z-index:8;overflow:auto;padding:20px 16px;text-align:center}
.fin{max-width:420px;margin:0 auto}
.qr{display:block;width:min(80vw,340px);height:auto;margin:12px auto;padding:8px;border:2px solid #000;border-radius:6px;background:#fff}
.okc{width:120px;height:120px;margin:0 auto 12px;display:block}
.okc circle{stroke:#16a34a;stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s ease-out forwards}
.okc path{stroke:#16a34a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .5s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.tick{animation:none}.okc circle,.okc path{animation:none;stroke-dashoffset:0}}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
header{position:sticky;top:0;background:#fff;z-index:5}
header b{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid #000;border-radius:999px;padding:3px 12px;font-weight:700}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;padding:6px 2px;border-radius:10px}
nav a .ic{width:1.4em;height:1.4em}
.card{border-radius:12px;box-shadow:3px 3px 0 #000}
button,a.b{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px}
button:active,a.b:active{transform:translate(1px,1px)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{border-radius:10px}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.ib{width:38px;height:38px;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ld{display:flex;align-items:center;justify-content:center;gap:12px;padding:28px 0;font-weight:600}
.sp{width:26px;height:26px;border:3px solid #ddd;border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.go::after{content:"";position:fixed;top:0;left:0;width:40%;height:3px;background:#000;z-index:30;animation:bar 1s ease-in-out infinite}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){.sp{animation:none;border-top-color:#000}body.go::after{animation:none;width:100%}}
.av{width:44px;height:44px;border-radius:50%;border:2px solid #000;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:#fff}</style></head>
<body data-page="buy">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></symbol><symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.8c0-1.2 1-1.8 2.5-1.8s2.5.7 2.5 1.8c0 2.4-5 1.2-5 3.8 0 1.2 1 1.9 2.5 1.9s2.5-.6 2.5-1.9"/></symbol><symbol id="i-boost" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol><symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8C9 8 8 4.5 10 4s2 4 2 4zM12 8c3 0 4-3.5 2-4s-2 4-2 4z"/></symbol><symbol id="i-yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></symbol><symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol><symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/></symbol><symbol id="i-follow" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8h16v-8M12 15V3M8 7l4-4 4 4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol><symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol></defs></svg><header><b><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> FollowPay</b><span class="pill" id="pw" hidden><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span id="pts"></span></span></header><nav><a href="home.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a><a href="earn.html"><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span>Earn</span></a><a href="boost.html"><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg><span>Boost</span></a><a href="buy.html" class=on><svg class="ic" aria-hidden="true"><use href="#i-wallet"/></svg><span>Buy</span></a><a href="refer.html"><svg class="ic" aria-hidden="true"><use href="#i-gift"/></svg><span>Refer</span></a><a href="profiles.html"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a></nav>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<h1>Buy points</h1><div class="card" id="packs"></div><h1>Transactions</h1><div id="tx"></div>
</main>
<script type="module">
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(m,t,cb)=>{if(!m)return;const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" role="alertdialog"><b>${esc(t||'Notice')}</b><p>${esc(m)}</p><button>OK</button></div>`;d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON'){d.remove();cb&&cb()}};document.body.append(d)};
const ok=(m,t,cb)=>say(m,t||'Done',cb);
const PL={youtube:'YouTube',instagram:'Instagram'};
const tok=localStorage.getItem('fp_t'),page=document.body.dataset.page,plat=sessionStorage.getItem('plat');
if(!tok||tok==='undefined'){location.href='index.html';throw 0}
if(!plat&&!['home','buy','profiles','refer'].includes(page)){location.href='home.html';throw 0}
const setPts=n=>{localStorage.setItem('fp_p',n);$('#pts').textContent=n;$('#pw').hidden=false};
if(localStorage.getItem('fp_p')){$('#pts').textContent=localStorage.getItem('fp_p');$('#pw').hidden=false}
async function api0(action,x={}){
  let r,j;
  try{r=await fetch('/api',{method:'POST',body:JSON.stringify({action,token:tok,...x})});j=await r.json()}catch(e){throw new Error('Cannot reach the server. Check your internet.')}
  if(r.status===401){localStorage.removeItem('fp_t');location.href='index.html';throw new Error('Please sign in again')}
  if(!r.ok)throw new Error(j.error||'Server error');
  return j;
}
let fly=0;
const hideLd=()=>{const l=$('#ld');if(l)l.remove()};
async function api(a,x){fly++;try{return await api0(a,x)}finally{if(--fly===0)setTimeout(hideLd,60)}}
setTimeout(hideLd,10000);
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(a&&/\.html/.test(a.getAttribute('href')))document.body.classList.add('go')});
addEventListener('pageshow',()=>document.body.classList.remove('go'));
const start=async()=>{try{const r=await api('me');setPts(r.user.points);
  const c=localStorage.getItem('fp_ref');if(c&&!r.user.refBy&&!(r.user.spent>0))api('useRef',{code:c}).catch(()=>{}).finally(()=>localStorage.removeItem('fp_ref'));
  return r}catch(e){say(e.message);throw e}};
const logout=()=>{localStorage.removeItem('fp_t');localStorage.removeItem('fp_p');sessionStorage.clear();location.href='index.html'};
const I=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const CFG={apiKey:"AIzaSyBxl8tOaw6eJpRbl4Elx5YGvfaWGbry-_g",authDomain:"followpay-a7dfe.firebaseapp.com",projectId:"followpay-a7dfe",appId:"1:361285479601:web:3725e5d93893022b8dc690"};
async function upgrade(){
  try{const V='https://www.gstatic.com/firebasejs/10.12.2/',[A,B]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js')]);
    const c=await B.signInWithPopup(B.getAuth(A.initializeApp(CFG)),new B.GoogleAuthProvider());
    await api('linkGoogle',{idToken:await c.user.getIdToken()});
    ok('Your account is now linked to Google. You can sign in with Google any time.','Account upgraded',()=>location.reload());
  }catch(e){say(e.code==='auth/popup-closed-by-user'?'Sign-in window was closed.':e.code==='auth/unauthorized-domain'?'Add folowpay.netlify.app in Firebase authorized domains.':e.message,'Could not upgrade')}
}
const PACKS=[[1,10],[20,70],[30,130],[50,300],[100,1000]];
$('#packs').innerHTML=PACKS.map(([rs,pt],i)=>`<button class="o" data-k="${i}">${I('wallet')} ₹${rs} → ${pt} points</button>`).join('');
let iv=null,busy=false;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const UPI='<svg width="96" height="40" viewBox="0 0 96 40" role="img" aria-label="UPI"><text x="4" y="30" font-family="system-ui,Arial,sans-serif" font-weight="800" font-style="italic" font-size="30" fill="#000">UPI</text><path d="M70 8l10 12-10 12z" fill="#f97316"/><path d="M80 8l10 12-10 12z" fill="#16a34a"/></svg>';
const closeFull=()=>{clearInterval(iv);const f=$('#full');if(f)f.remove()};
const success=n=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" style="text-align:center" role="alertdialog"><svg class="okc" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none"/><path fill="none" d="M14 27l8 8 16-17"/></svg><b>Payment successful</b><p>+${n} points added to your account</p><button>Done</button></div>`;d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON')d.remove()};document.body.append(d)};
async function check(id){
  try{const r=await api('check',{orderId:id});
    if(r.status==='PAID'){closeFull();if(r.points!=null)setPts(r.points);if(r.pts)success(r.pts);loadTx();return true}
    if(r.status==='EXPIRED'){closeFull();loadTx();say('Payment time ended. If you already paid, check Transactions.','Time is up')}
  }catch(e){}
  return false;
}
function show(o){
  closeFull();const f=document.createElement('div');f.className='full';f.id='full';
  f.innerHTML=`<div class="fin">${UPI}<h1>Pay ₹${esc(o.amount)}</h1><p class="m">Scan with any UPI app and pay the exact amount.</p><img class="qr" src="${esc(o.qr)}" alt="UPI QR code"><p class="m">Order ${esc(o.id)} · ${o.pts} points</p><p><b id="tm"></b></p><p class="m">Waiting for payment… this screen updates by itself.</p><button id="cn" class="o">Cancel</button></div>`;
  document.body.append(f);
  iv=setInterval(()=>{const left=Math.max(0,Math.round((o.exp-Date.now())/1000));$('#tm').textContent=fmt(left);
    if(left<=0){closeFull();loadTx();say('Payment time ended. If you already paid, tap Check payment under Transactions.','Time is up');return}
    if(!busy){busy=true;check(o.id).finally(()=>busy=false)}},1000);
  $('#cn').onclick=async()=>{const b=$('#cn');b.disabled=true;b.textContent='Cancelling…';clearInterval(iv);
    try{const r=await api('cancel',{orderId:o.id});if(r.status==='PAID'){if(r.points!=null)setPts(r.points);if(r.pts)success(r.pts)}}catch(e){}
    closeFull();loadTx()};
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{show(await api('buy',{pack:+b.dataset.k}));loadTx()}catch(e){say(e.message,'Could not create order')}b.disabled=false});
async function loadTx(){
  try{const {txs}=await api('txs'),now=Date.now();
    const list=txs.filter(x=>x.status==='PAID'||(x.status==='PENDING'&&now<x.exp+60000));
    $('#tx').innerHTML=list.map(x=>`<div class="row"><span>₹${x.rs} · ${x.pts} pts<br><span class="m">${new Date(x.created).toLocaleString()}</span></span><span>${x.status==='PAID'?'<b style="color:#16a34a">✓ Paid</b>':`<button data-c="${esc(x.id)}">Check payment</button>`}</span></div>`).join('')||'<p class="m">No transactions yet.</p>';
    $('#tx').querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const x=list.find(t=>t.id===b.dataset.c);if(await check(x.id)!==true&&x.exp>Date.now())show(x)});
  }catch(e){say(e.message)}
}
start().then(r=>{if(r.user.guest){document.querySelectorAll('[data-k]').forEach(b=>b.disabled=true);
  $('#packs').insertAdjacentHTML('beforebegin',`<div class="card"><b>${I('lock')} Google account needed</b><p class="m">Buying points needs a Google account. Upgrade your guest account in one tap. Your points and profiles stay safe.</p><button id="ug">${I('up')} Upgrade to Google</button></div>`);$('#ug').onclick=upgrade}}).catch(()=>{});
loadTx();
</script></body></html>
