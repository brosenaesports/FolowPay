<body data-page="profiles">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></symbol><symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.8c0-1.2 1-1.8 2.5-1.8s2.5.7 2.5 1.8c0 2.4-5 1.2-5 3.8 0 1.2 1 1.9 2.5 1.9s2.5-.6 2.5-1.9"/></symbol><symbol id="i-boost" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol><symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8C9 8 8 4.5 10 4s2 4 2 4zM12 8c3 0 4-3.5 2-4s-2 4-2 4z"/></symbol><symbol id="i-yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></symbol><symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol><symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/></symbol><symbol id="i-follow" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8h16v-8M12 15V3M8 7l4-4 4 4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol><symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol></defs></svg><header><b><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> FollowPay</b><span class="pill" id="pw" hidden><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span id="pts"></span></span></header><nav><a href="home.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a><a href="earn.html"><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span>Earn</span></a><a href="boost.html"><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg><span>Boost</span></a><a href="buy.html"><svg class="ic" aria-hidden="true"><use href="#i-wallet"/></svg><span>Buy</span></a><a href="store.html"><svg class="ic" aria-hidden="true"><use href="#i-gift"/></svg><span>Rewards</span></a><a href="refer.html"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg><span>Refer</span></a><a href="profiles.html" class=on><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a></nav>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div id="t"></div>
</main>
<script src="/core.js?v=22"></script>
<script type="module">
const r=await start(),t=$('#t');
const av=x=>x.pic?`<img class="av" src="${esc(x.pic)}" alt="" referrerpolicy="no-referrer">`:`<span class="av">${esc(x.handle.replace('@','').charAt(0).toUpperCase())}</span>`;
const sec=p=>{const yt=p==='youtube',l=Object.values(r.profiles[p]||{}),full=l.length>=3;
  return `<section class="card pfc"><div class="pfh ${p}"><span class="pli">${I(yt?'yt':'ig')}</span><div><h2>${PL[p]}</h2><small>${l.length} of 3 profiles linked</small></div></div>
  <div class="pfb"><div class="slots" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i<l.length?'f':''}"></i>`).join('')}</div>
  ${l.map(x=>`<div class="pfr">${av(x)}<div class="pn"><b>${esc(x.handle)}</b><br>${x.ok?'<span class="st ok">'+I('shield')+' Verified</span>':'<span class="st">Not verified</span>'}</div><button class="o sm rm" data-r="${p}" data-h="${esc(x.handle)}">${I('out')} Remove</button></div>`).join('')||`<p class="m">No ${PL[p]} profile linked yet.</p>`}
  ${full?`<p class="m">${I('info')} All 3 slots are used. Remove a profile to add another.</p>`:`<div class="pfadd"><b>Add ${yt?'a':'an'} ${PL[p]} profile</b><input data-i="${p}" placeholder="${yt?'@AKGAMER-s8s':'Instagram username'}" autocapitalize="off" autocomplete="off" aria-label="${PL[p]} profile name"><button data-a="${p}" class="${yt?'byt':'big'}">${I(yt?'yt':'ig')} Link ${PL[p]} profile</button></div>`}
  <p class="m">You can remove a profile 24 hours after linking it.</p></div></section>`};
const gst=r.user.guest;
t.innerHTML=`<div class="acct"><span class="big-ic">${I('user')}</span><div><b>${esc(r.user.name||'Your account')}</b><br><span class="st ${gst?'':'ok'}" style="${gst?'':'color:#166534'}">${gst?'Guest account':'Google account'}</span></div><div class="ap"><b>${(r.user.points||0).toLocaleString('en-IN')}</b><small>points</small></div></div>`
 +(gst?`<div class="card gup"><b>${I('lock')} Guest account</b><p class="m" style="color:#422006">Upgrade to Google to buy points, refer friends and sign in from any device.</p><button id="lg" class="gbtn"><svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Upgrade with Google</button></div>`:'')
 +(plat==='instagram'?['instagram','youtube']:['youtube','instagram']).map(sec).join('')
 +`<button class="o" id="lo">${I('out')} Log out</button>`;
const act=async(a,p,h,b)=>{const tx=b.innerHTML;b.disabled=true;b.innerHTML=`<span class="sp"></span> ${a==='bind'?'Checking account…':'Removing…'}`;
  try{await api(a,{platform:p,handle:h});ok(a==='bind'?'Profile linked.':'Profile removed.','Done',()=>location.reload())}
  catch(e){say(e.message,a==='bind'?'Could not link profile':'Could not remove');b.disabled=false;b.innerHTML=tx}};
t.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const v=t.querySelector(`[data-i="${b.dataset.a}"]`).value.trim();if(!v)return say('Enter your '+PL[b.dataset.a]+' profile name first.','Profile needed');act('bind',b.dataset.a,v,b)});
t.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(await ask('Remove this profile?',b.dataset.h+' will be unlinked from your account.')!==null)act('remove',b.dataset.r,b.dataset.h,b)});
if($('#lg'))$('#lg').onclick=upgrade;
$('#lo').onclick=logout;
</script></body></html>
