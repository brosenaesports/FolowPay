<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My orders – FollowPay</title><meta name="description" content="Earn points by subscribing, following and liking. Spend them to grow your own YouTube channel or Instagram profile."><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.webp" type="image/webp">
<link rel="stylesheet" href="/core.css?v=30"></head>
<body data-page="orders">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/></symbol><symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.8c0-1.2 1-1.8 2.5-1.8s2.5.7 2.5 1.8c0 2.4-5 1.2-5 3.8 0 1.2 1 1.9 2.5 1.9s2.5-.6 2.5-1.9"/></symbol><symbol id="i-boost" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol><symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol><symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8C9 8 8 4.5 10 4s2 4 2 4zM12 8c3 0 4-3.5 2-4s-2 4-2 4z"/></symbol><symbol id="i-yt" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/></symbol><symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></symbol><symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11z"/></symbol><symbol id="i-follow" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8h16v-8M12 15V3M8 7l4-4 4 4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol><symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol><symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol></defs></svg><header><b><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> FollowPay</b><span class="pill" id="pw" hidden><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span id="pts"></span></span></header><div class="bk"><a href="home.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>← Back to home</span></a></div>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div class="hd"><h1>My orders</h1><button class="o sm" id="rf"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg> Refresh</button></div>
<p class="m" style="margin-top:0">Tap an order to see details, <b>report a problem</b> or <b>request a refill</b> (Premium and Ultra premium orders, after completion). Completed normal orders are removed 3 days after they finish.</p>
<div class="tabs" id="pf" style="margin:8px 0"></div><div id="ol"><p class="m">Loading orders…</p></div>
</main>
<script src="/core.js?v=30"></script>
<script type="module">
start().catch(()=>{});
const TO=ms=>new Promise((_,j)=>setTimeout(()=>j(new Error('The server is taking too long. Tap Retry.')),ms));
const PRI=[['normal','Normal','user','Standard speed.'],['premium','Premium','star','Fast boosting priority + free refill for up to 30 days.'],['ultra','Ultra premium','zap','Fastest boosting priority + free refill for up to 30 days.']];
const NMS={subscribe:'Subscribers',follow:'Followers',like:'Likes',views:'Views',comment:'Comments',watch:'Watch time',visits:'Profile visits'},IC2={subscribe:'bell',follow:'follow',like:'heart',views:'eye',comment:'msg',watch:'clock',visits:'boost'};
const hasPri=c=>['subscribe','follow','like'].includes(c);
let PF='all',ALL=[];
const RS={review:'In review',done:'Completed',rejected:'Rejected'},RPS={open:'Received',processing:'In process',solved:'Solved'},RD={};
const ORD={};let BUSY=0;
const spin=(b,t)=>{b.disabled=true;b.dataset.h=b.innerHTML;b.innerHTML=`<span class="sp"></span> ${t}`};
const unspin=b=>{b.disabled=false;if(b.dataset.h)b.innerHTML=b.dataset.h};
const working=(host,t)=>{const w=document.createElement('div');w.className='wl';w.setAttribute('role','status');w.innerHTML=`<span class="sp"></span><b>${t}</b>`;host.append(w);return w};
const info=x=>{const d=x.done||0,dn=x.status==='completed',p=dn?100:Math.min(100,Math.round(d/x.qty*100)),w=x.type==='watch',pr=PRI.find(z=>z[0]===x.tier)||PRI[0];return{d,dn,p,w,pr,dl:dn?x.qty:d}};
const row=x=>{
  ORD[x.id]=x;const {dn,p,w,pr,dl}=info(x);
  const tag=hasPri(x.type)?`<span class="tag">${I(pr[2])} ${pr[1]}</span>`:'';
  return `<button type="button" class="card oc o" data-o="${x.id}"><div class="sh" style="margin:0"><span class="big-ic">${I(IC2[x.type])}</span><div style="flex:1;text-align:left"><b>${NMS[x.type]}</b><p class="m" style="margin:0">${PL[x.platform]||''} · ${esc(x.handle)}</p></div><span class="st ${dn?'ok':''}">${dn?'Completed':'In progress'}</span></div><div style="margin:10px 0 6px;text-align:left">${tag}</div><div class="pb" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i class="${dn?'go':''}" style="width:${p}%"></i></div><p class="m" style="text-align:left"><b>${w?dl*x.mins+' of '+x.qty*x.mins+' min':dl+' of '+x.qty}</b> · ${p}% · Tap for details</p></button>`};
const showSheet=id=>{
  const x=ORD[id];if(!x)return;
  const {dn,p,w,pr,dl}=info(x),old=$('#osh');if(old)old.remove();
  const rf=x.refill?`<p class="m">${I('refresh')} Refill: <b>${RS[x.refill.status]||'In review'}</b></p>`:x.canRefill?`<button data-rf="${x.id}">${I('refresh')} Request refill · until ${new Date(x.refillUntil).toLocaleDateString()}</button>`:(hasPri(x.type)&&x.tier!=='normal'?`<p class="m">${I('refresh')} 30-day refill included. You can request it after the order completes.</p>`:`<p class="m">${I('info')} Refill is available for Premium and Ultra premium orders. This normal order is removed 3 days after it completes.</p>`);
  const KV=(ic,n,v)=>`<div class="kv"><span>${I(ic)} ${n}</span><b>${v}</b></div>`;
  const d=document.createElement('div');d.className='sheet';d.id='osh';
  d.innerHTML=`<div role="dialog" aria-label="Order details"><div class="sh"><span class="big-ic">${I(IC2[x.type])}</span><h2>${NMS[x.type]}<br><span class="m">${esc(x.handle)}</span></h2><button class="o sm" data-x aria-label="Close">${I('out')} Close</button></div>
  <div class="pct">${p}%</div><div class="pb" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i class="${dn?'go':''}" style="width:${p}%"></i></div>
  <p class="m" style="text-align:center"><b>${w?dl*x.mins+' of '+x.qty*x.mins+' min':dl+' of '+x.qty}</b> delivered</p>
  ${KV('clock','Status',`<span class="st ${dn?'ok':''}">${dn?'Completed':'In progress'}</span>`)}
  ${hasPri(x.type)?KV(pr[2],'Priority',pr[1]+' · '+pr[3]):KV('user','Priority','Normal · standard speed')}
  ${KV('coin','Points used',x.cost!=null?x.cost:'–')}
  ${x.created?KV('clock','Placed',new Date(x.created).toLocaleString()):''}
  ${x.link?KV('share','Link',`<a href="${esc(x.link)}" target="_blank" rel="noopener">Open</a>`):''}
  <div style="margin-top:14px">${rf}</div>
  <div class="rpt"><b>${I('msg')} Report a problem</b>
  ${(x.reports||[]).map(z=>`<div class="rp"><span class="st ${z.status==='solved'?'ok':''}">${RPS[z.status]||'Received'}</span> <span class="m">${new Date(z.at).toLocaleString()}</span><p style="margin:.4em 0">${esc(z.comment)}</p>${z.note?`<p class="m" style="margin:0">${I('info')} Admin: ${esc(z.note)}</p>`:''}</div>`).join('')}
  ${(x.reports||[]).length>=1?`<p class="m">${I('info')} You have already reported this order. We will update the status above.</p>`:`<textarea id="rc" rows="3" maxlength="500" placeholder="Something wrong with this order? Tell us here…">${esc(RD[id]||'')}</textarea><button id="rsend" data-rp="${x.id}">${I('msg')} Send report</button>`}</div></div>`;
  d.oninput=e=>{if(e.target.id==='rc')RD[id]=e.target.value};
  d.onclick=async e=>{
    if(e.target===d||e.target.closest('[data-x]')){d.remove();return}
    const rp=e.target.closest('[data-rp]');
    if(rp){const c=($('#rc').value||'').trim();if(c.length<5)return say('Write at least 5 characters about the problem.','Report');
      BUSY++;spin(rp,'Sending…');const w=working(d,'Sending your report…');
      try{await api('report',{orderId:rp.dataset.rp,comment:c});RD[rp.dataset.rp]='';BUSY--;w.remove();ok('Your report was sent. We will look into it and update the status here.','Report sent',loadOrders)}
      catch(er){BUSY--;w.remove();unspin(rp);say(er.message,'Could not send report')}return}
    const b=e.target.closest('[data-rf]');if(!b)return;
    if(await ask('Request a refill?','You can request one refill per order, within 30 days of completion. Our team will review it.')===null)return;
    BUSY++;spin(b,'Requesting…');const w2=working(d,'Sending your refill request…');
    try{await api('refill',{orderId:b.dataset.rf});BUSY--;w2.remove();d.remove();ok('Your refill request is in review.','Refill requested',loadOrders)}
    catch(er){BUSY--;w2.remove();unspin(b);say(er.message,'Could not request refill')}};
  document.body.append(d);
};
const showOrders=o=>{const l=[...o.filter(x=>x.status!=='completed'),...o.filter(x=>x.status==='completed')];$('#ol').innerHTML=l.length?'<div class="olist">'+l.map(x=>{try{return row(x)}catch(e){return ''}}).join('')+'</div>':'<p class="m">No orders yet.</p>';if(!BUSY&&$('#osh')&&ORD[window.__oid]&&document.activeElement&&document.activeElement.id!=='rc')showSheet(window.__oid);
  if(!window.__hd&&/^#o-/.test(location.hash)){window.__hd=1;const id=location.hash.slice(3);if(ORD[id]){window.__oid=id;showSheet(id)}}};

const loadOrders=()=>Promise.race([Promise.all([api('orders',{platform:'youtube'}),api('orders',{platform:'instagram'})]),TO(25000)]).then(([a,b])=>{ALL=[...a.orders,...b.orders].sort((m,n)=>(n.created||0)-(m.created||0));drawOrders()}).catch(e=>{$('#ol').innerHTML=`<div class="card"><p class="m">${esc(e.message)}</p><button class="o" id="ro">Retry</button></div>`;$('#ro').onclick=()=>{$('#ol').innerHTML='<p class="m">Loading orders…</p>';loadOrders()}});
function drawOrders(){
  $('#pf').innerHTML=[['all','All'],['youtube','YouTube'],['instagram','Instagram']].map(([k,n])=>`<button type="button" class="${k===PF?'':'o'}" data-pf="${k}">${k==='youtube'?I('yt')+' ':k==='instagram'?I('ig')+' ':''}${n}</button>`).join('');
  showOrders(ALL.filter(x=>PF==='all'||x.platform===PF));
}

$('#ol').onclick=e=>{const b=e.target.closest('[data-o]');if(b){window.__oid=b.dataset.o;showSheet(b.dataset.o)}};
$('#pf').onclick=e=>{const b=e.target.closest('[data-pf]');if(b){PF=b.dataset.pf;drawOrders()}};
$('#rf').onclick=async()=>{const b=$('#rf');b.disabled=true;await loadOrders();b.disabled=false};
loadOrders();setInterval(()=>{if(!document.hidden)loadOrders()},15000);
</script></body></html>
