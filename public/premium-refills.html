<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><link rel="icon" href="/favicon.webp" type="image/webp"><meta name="theme-color" content="#0b1020">
<title>Refills – FollowPay Premium</title>
<link rel="stylesheet" href="/premium.css?v=4">
</head><body>
<div id="shell"></div>
<script src="/pm.js?v=4"></script>
<script type="module">
shell('refills');
const app=$('#app'),DAY=864e5;
let ORD=[],view='ready',skew=0,syncing=false;     // skew = server clock minus this phone's clock
app.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1 style="margin:.2em 0">Refills</h1><button class="sm dark" id="rf">${I('refresh')} Refresh</button></div>
<p class="m" style="margin-top:0">Track every refill request. The <b>Request refill</b> button opens <b>24 hours after an order is completed</b>, and again 24 hours after your last request on that order.</p>
<div class="chips" id="vw"></div><div id="ls"></div>`;
const now=()=>Date.now()+skew;
const done=o=>/^(complete|success|finish)/i.test(o.status||'');
const RB=s=>/^completed/i.test(s)?['Completed','g']:/^(rejected|canceled|cancelled|error|fail)/i.test(s)?['Not approved','r']:/^(in progress|processing)/i.test(s)?['In progress','b']:['Pending','a'];
const open=f=>!/^(completed|rejected|canceled|cancelled|error|failed)/i.test(f.status||'');
const left=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:m?`${m}m ${String(x).padStart(2,'0')}s`:`${x}s`};
// state of one order: none (service has no refill) | wait (not completed yet) | cool (waiting 24h) | busy (refill running) | ready
const st=o=>{if(!o.canRefill)return'none';if(!done(o))return'wait';if(o.refills.some(open))return'busy';return o.refillAt&&now()<o.refillAt?'cool':'ready'};
const reqs=()=>ORD.flatMap(o=>o.refills.map(f=>({...f,o}))).sort((a,b)=>b.at-a.at);
function head(o){return `<div class="oh"><span class="pi pf-${o.p}">${pIcon(o.p)}</span><div style="flex:1;min-width:0"><h2>${esc(o.name)}</h2><a class="lk" href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.link)}</a></div></div>`}
function orderCard(o){
  const s=st(o),n=o.refills.length;
  const btn=s==='ready'?`<button data-rf="${o.id}">${I('refresh')} Request refill</button>`
    :s==='cool'?`<button disabled>${I('clock')} Opens in <span class="cd" data-at="${o.refillAt}">${left(o.refillAt-now())}</span></button>`
    :s==='busy'?`<button disabled>${I('refresh')} Refill in progress</button>`
    :`<button disabled>${I('clock')} Refill after completion</button>`;
  return `<article class="card od">${head(o)}
  <div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${o.panel?`<span class="num" style="cursor:default">Order #${esc(o.panel)}</span>`:''}<span class="bdg ${done(o)?'g':'a'}">${done(o)?'Completed':esc(o.status)}</span></div>
  ${o.doneAt?`<div class="kv"><span>Completed</span><b>${dt(o.doneAt)}</b></div>`:''}
  ${o.refillAt&&done(o)?`<div class="kv"><span>${s==='ready'?'Refill opened':'Refill opens'}</span><b>${dt(o.refillAt)}</b></div>`:''}
  <div class="kv"><span>Refills requested</span><b>${n}</b></div>
  <div class="acts">${btn}</div></article>`}
function reqCard(x){
  const [n,c]=RB(x.status),o=x.o;
  return `<article class="card od">${head(o)}
  <div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="num" style="cursor:default">${I('refresh')} Refill #${esc(x.id)}</span><span class="bdg ${c}">${n}</span></div>
  <div class="kv"><span>Order number</span><b>${o.panel?'#'+esc(o.panel):'-'}</b></div>
  <div class="kv"><span>Requested</span><b>${dt(x.at)}</b></div>
  ${/^(completed)/i.test(x.status)?'':`<p class="m" style="margin:.4em 0 0">${I('info')} Status updates here automatically.</p>`}</article>`}
function draw(){
  const R=reqs(),ready=ORD.filter(o=>st(o)==='ready'),wait=ORD.filter(o=>['cool','wait','busy'].includes(st(o)));
  const act=R.filter(open).length;
  $('#vw').innerHTML=[['ready','Ready',ready.length],['wait','Waiting',wait.length],['req','Requests',R.length]].map(([k,n,c])=>`<button type="button" class="${k===view?'on':''}" data-v="${k}">${n} (${c})</button>`).join('');
  const sum=`<div class="card"><div class="kv"><span>Refill requests</span><b>${R.length}</b></div><div class="kv"><span>In progress</span><b>${act}</b></div><div class="kv"><span>Completed</span><b>${R.filter(x=>/^completed/i.test(x.status)).length}</b></div><div class="kv"><span>Not approved</span><b>${R.filter(x=>RB(x.status)[1]==='r').length}</b></div></div>`;
  const empty=(t,m)=>`<div class="card"><b>${t}</b><p class="m">${m}</p></div>`;
  let h;
  if(view==='ready')h=ready.map(orderCard).join('')||empty('No orders are ready for refill','Completed orders with refill support appear here 24 hours after completion.');
  else if(view==='wait')h=wait.map(orderCard).join('')||empty('Nothing waiting','Orders that are running, in a 24 hour wait or already being refilled show up here.');
  else h=sum+(R.map(reqCard).join('')||empty('No refill requests yet','When you request a refill it is tracked here.'));
  $('#ls').innerHTML=h;
}
const setOrders=r=>{if(r.now)skew=r.now-Date.now();ORD=r.orders;draw()};
async function load(quiet){
  try{setOrders(await api('pmOrders',{fast:true}))}
  catch(e){if(!quiet)$('#ls').innerHTML=`<div class="card"><b>Could not load refills</b><p class="m">${esc(e.message)}</p></div>`;return}
  if(syncing)return;syncing=true;
  try{setOrders(await api('pmOrders'))}catch(e){}finally{syncing=false}
}
app.addEventListener('click',async e=>{
  const v=e.target.closest('[data-v]'),rf=e.target.closest('[data-rf]');
  if(v){view=v.dataset.v;draw()}
  else if(rf){
    const o=ORD.find(x=>x.id===rf.dataset.rf);if(!o||st(o)!=='ready')return draw();
    if(!await yes('Request a refill?','We will ask the booster service to refill this order. You can request again 24 hours after this request if needed.','Request refill'))return;
    try{await withBusy('Requesting your refill…',()=>api('pmRefill',{orderId:o.id}),0);await say('Refill requested. Track it under Requests.','Refill requested');view='req';await load(true)}
    catch(er){await say(er.message,'Could not request refill');load(true)}}
});
$('#rf').onclick=()=>withBusy('Refreshing…',()=>load(),0);
// live countdown; when a timer reaches zero the button turns into a working one
setInterval(()=>{let flip=false;$$('.cd').forEach(el=>{const d=+el.dataset.at-now();if(d<=0)flip=true;else el.textContent=left(d)});if(flip)draw()},1000);
api('pmWallet',{lite:true}).then(w=>setBal(w.bal)).catch(()=>{});
await withBusy('Loading your refills…',()=>load(),0);
setInterval(()=>{if(!document.hidden&&!$('.pmov'))load(true)},30000);
</script></body></html>
