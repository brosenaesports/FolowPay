1 2-2h10"/></symbol><symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/></symbol><symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol><symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol></defs></svg><header><b><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg> FollowPay</b><span class="pill" id="pw" hidden><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span id="pts"></span></span></header><nav><a href="home.html"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a><a href="earn.html"><svg class="ic" aria-hidden="true"><use href="#i-coin"/></svg><span>Earn</span></a><a href="boost.html" class=on><svg class="ic" aria-hidden="true"><use href="#i-boost"/></svg><span>Boost</span></a><a href="buy.html"><svg class="ic" aria-hidden="true"><use href="#i-wallet"/></svg><span>Buy</span></a><a href="store.html"><svg class="ic" aria-hidden="true"><use href="#i-gift"/></svg><span>Rewards</span></a><a href="refer.html"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg><span>Refer</span></a><a href="profiles.html"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a></nav>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div id="sp"></div><div class="hd"><h1>Boost</h1><button class="o sm" id="rt"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg> Rates</button></div><div id="t"></div>
</main>
<script src="/core.js?v=14"></script>
<script type="module">
$('#sp').innerHTML=platBar();platBind();
const yt=plat==='youtube',RT=(n,v)=>`<div class="row"><span>${n}</span><b>${v}</b></div>`;
$('#rt').onclick=()=>box('Boost rates',(yt?RT(I('bell')+' Normal subscriber','3 points')+RT(I('star')+' Premium subscriber','4 points')+RT(I('zap')+' Ultra premium subscriber','5 points'):RT(I('follow')+' Normal follower','3 points')+RT(I('star')+' Premium follower','4 points')+RT(I('zap')+' Ultra premium follower','5 points'))
  +RT(I('heart')+' Normal like','2 points')+RT(I('star')+' Premium like','3 points')+RT(I('zap')+' Ultra premium like','4 points')
  +RT(I('eye')+' Views','1 point')+RT(I('msg')+' Comments','1 point')+(yt?RT(I('clock')+' Watch time','8 points / minute'):RT(I('boost')+' Profile visits','1 point'))
  +'<p class="m">Premium and Ultra premium orders get fast boosting priority and a free refill for up to 30 days (one refill per order).</p>');
const t=$('#t'),TO=ms=>new Promise((_,j)=>setTimeout(()=>j(new Error('The server is taking too long. Tap Retry.')),ms));
t.innerHTML='<div class="ld"><span class="sp"></span><span>Loading your profiles… the server may take a few seconds to wake up.</span></div>';
let r;
try{r=await Promise.race([start(),TO(25000)])}
catch(e){t.innerHTML=`<div class="card"><p class="m">${esc(e.message)}</p><button id="rty">Retry</button></div>`;$('#rty').onclick=()=>location.reload();throw e}
const list=Object.values(r.profiles[plat]||{});
const CATS=yt?[['subscribe','Subscribers','bell'],['like','Likes','heart'],['views','Views','eye'],['comment','Comments','msg'],['watch','Watch time','clock']]:[['follow','Followers','follow'],['like','Likes','heart'],['views','Views','eye'],['comment','Comments','msg'],['visits','Profile visits','boost']];
const PRI=[['normal','Normal','user','Standard speed.'],['premium','Premium','star','Fast boosting priority + free refill for up to 30 days.'],['ultra','Ultra premium','zap','Fastest boosting priority + free refill for up to 30 days.']];
const NMS={subscribe:'Subscribers',follow:'Followers',like:'Likes',views:'Views',comment:'Comments',watch:'Watch time',visits:'Profile visits'},IC2={subscribe:'bell',follow:'follow',like:'heart',views:'eye',comment:'msg',watch:'clock',visits:'boost'};
const COST={subscribe:[3,4,5],follow:[3,4,5],like:[2,3,4],views:[1],comment:[1],visits:[1]},PK=[15,30,45,60,1000,2000,3000,4000,5000,6000,7000,8000,9000,10000];
const hasPri=c=>['subscribe','follow','like'].includes(c);
let cat=CATS[0][0],pri='normal';
const chips=(el,arr,cur)=>{el.innerHTML=arr.map(([k,n,i])=>`<button type="button" class="${k===cur?'':'o'}" data-k="${k}">${I(i)}<span>${n}</span></button>`).join('')};
const RS={review:'In review',done:'Completed',rejected:'Rejected'};
const row=x=>{
  const d=x.done||0,dn=x.status==='completed',p=dn?100:Math.min(100,Math.round(d/x.qty*100)),w=x.type==='watch',pr=PRI.find(z=>z[0]===x.tier);
  const tag=hasPri(x.type)?`<span class="tag">${I(pr[2])} ${pr[1]}</span>`:'';
  const rf=x.refill?`<p class="m">${I('refresh')} Refill: <b>${RS[x.refill.status]||'In review'}</b></p>`:x.canRefill?`<button class="o" data-rf="${x.id}">${I('refresh')} Request refill · until ${new Date(x.refillUntil).toLocaleDateString()}</button>`:(hasPri(x.type)&&x.tier!=='normal'?`<p class="m">${I('refresh')} 30-day refill included</p>`:'');
  const dl=dn?x.qty:d;
  return `<div class="card"><div class="row" style="border:0;padding:0"><b>${I(IC2[x.type])} ${NMS[x.type]}</b><span class="st ${dn?'ok':''}">${dn?'Completed':'In progress'}</span></div><div style="margin:6px 0">${tag}</div><p class="m">${esc(x.handle)}</p><div class="pb" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div><p class="m"><b>${w?dl*x.mins+' of '+x.qty*x.mins+' min':dl+' of '+x.qty}</b> delivered · ${p}%</p>${rf}</div>`};
const showOrders=o=>{const l=[...o.filter(x=>x.status!=='completed'),...o.filter(x=>x.status==='completed')];$('#ol').innerHTML=l.map(x=>{try{return row(x)}catch(e){return ''}}).join('')||'<p class="m">No orders yet.</p>'};
const loadOrders=()=>Promise.race([api('orders',{platform:plat}),TO(25000)]).then(j=>showOrders(j.orders)).catch(e=>{$('#ol').innerHTML=`<div class="card"><p class="m">${esc(e.message)}</p><button class="o" id="ro">Retry</button></div>`;$('#ro').onclick=()=>{$('#ol').innerHTML='<p class="m">Loading orders…</p>';loadOrders()}});
t.innerHTML=(list.length?`<div class="card"><select id="bp">${list.map(p=>`<option>${esc(p.handle)}</option>`).join('')}</select><p class="m">Category</p><div class="grid" id="cg"></div><div id="prw"><p class="m">Priority</p><div class="grid" id="pg"></div><p class="m" id="pn"></p></div><select id="bpk" hidden>${PK.map(m=>`<option value="${m}">${m>=1000?m.toLocaleString('en-IN'):m} minutes</option>`).join('')}</select><input id="bq" type="number" min="1" inputmode="numeric"><input id="bw" type="number" min="1" inputmode="numeric" placeholder="Video length in minutes" hidden><input id="bk" placeholder="Video link" hidden><p class="m" id="sum"></p><button id="bg">Create order</button></div>`:'<div class="card"><p class="m">Link a profile first on the Profiles page.</p></div>')+'<h1>My orders</h1><div id="ol"><p class="m">Loading orders…</p></div>';
loadOrders();setInterval(loadOrders,15000);
$('#ol').onclick=async e=>{const b=e.target.closest('[data-rf]');if(!b)return;
  if(await ask('Request a refill?','You can request one refill per order, within 30 days of completion. Our team will review it.')===null)return;
  b.disabled=true;try{await api('refill',{orderId:b.dataset.rf});ok('Your refill request is in review.','Refill requested',loadOrders)}catch(er){say(er.message,'Could not request refill');b.disabled=false}};
if(list.length){
  const upd=()=>{
    chips($('#cg'),CATS,cat);chips($('#pg'),PRI,pri);
    const w=cat==='watch',f=['follow','visits'].includes(cat);
    $('#prw').hidden=!hasPri(cat);$('#pn').textContent=PRI.find(z=>z[0]===pri)[3];
    $('#bpk').hidden=!w;$('#bw').hidden=!w;$('#bq').hidden=w;$('#bk').hidden=f;
    $('#bk').placeholder=yt?'Video link (must be on this channel)':'Reel or post link (must be on this account)';
    $('#bq').placeholder='How many '+NMS[cat].toLowerCase()+(cat==='visits'?' (minimum 100)':'');
    let sm;
    if(w){const len=+$('#bw').value||0,tot=+$('#bpk').value;if(len>=1){const m=Math.min(15,Math.floor(len)),n=Math.ceil(tot/m);sm=n>1000?'This video is too short for this package.':`${n} tasks of ${m} min (${n*m} min total) · ${n*m*8} points`}else sm='Enter the video length in minutes.'}
    else{const q=+$('#bq').value||0,u=COST[cat][hasPri(cat)?PRI.findIndex(z=>z[0]===pri):0];sm=q?`Total: ${q*u} points`:'Enter how many you want.'}
    $('#sum').textContent=sm;
  };
  $('#cg').onclick=e=>{const b=e.target.closest('[data-k]');if(b){cat=b.dataset.k;upd()}};
  $('#pg').onclick=e=>{const b=e.target.closest('[data-k]');if(b){pri=b.dataset.k;upd()}};
  ['bq','bw','bpk'].forEach(i=>{$('#'+i).oninput=upd});upd();
  $('#bg').onclick=async()=>{const b=$('#bg');b.disabled=true;b.textContent='Checking…';
    try{const x=await api('boost',{platform:plat,handle:$('#bp').value,type:cat,tier:pri,qty:+$('#bq').value,total:+$('#bpk').value,len:+$('#bw').value,link:$('#bk').value});
      ok(`${x.cost} points used. Your order is in progress.`,'Order placed',()=>location.reload());
    }catch(e){say(e.message,'Could not create order');b.disabled=false;b.textContent='Create order'}};
}
</script></body></html>
