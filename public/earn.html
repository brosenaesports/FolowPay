<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earn free points – FollowPay</title><meta name="description" content="Earn points by subscribing, following and liking. Spend them to grow your own YouTube channel or Instagram profile."><meta name="robots" content="noindex">

<style>*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#000}
header{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto;padding:16px;border-bottom:2px solid #000}
header b{font-size:1.25rem;letter-spacing:-.02em}
nav{display:flex;gap:4px;max-width:520px;margin:0 auto;padding:10px 16px 0}
nav a{flex:1;text-align:center;padding:8px 2px;border:2px solid #000;border-radius:6px;color:#000;text-decoration:none;font-weight:600;font-size:.8rem}
nav a.on{background:#000;color:#fff}
main{max-width:520px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:1.5rem;line-height:1.15;margin:.4em 0;letter-spacing:-.02em}
.card{border:2px solid #000;border-radius:6px;padding:16px;margin:16px 0}
button,a.b{display:block;font:inherit;font-weight:600;width:100%;padding:13px 16px;margin:6px 0;border:2px solid #000;border-radius:6px;background:#000;color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.o{background:#fff!important;color:#000!important}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #000;outline-offset:2px}
input,select{font:inherit;width:100%;padding:12px;margin:6px 0;border:2px solid #000;border-radius:6px;background:#fff;color:#000}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #000}
.row button{width:auto;margin:0;padding:6px 12px}
.m{color:#555;font-size:.9rem;margin:.4em 0}
.tabs{display:flex;gap:6px}.tabs button{margin:6px 0;padding:10px 6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.pop{background:#fff;border:2px solid #000;border-radius:6px;padding:20px;max-width:360px;width:100%}
.pop b{font-size:1.2rem}.pop p{margin:.6em 0 1em}.pop button{margin:0}
.tick{width:72px;height:72px;margin:0 auto 12px;border:3px solid #000;border-radius:50%;font-size:2.4rem;line-height:66px;animation:pp .4s ease-out}
@keyframes pp{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.full{position:fixed;inset:0;background:#fff;z-index:8;overflow:auto;padding:20px 16px;text-align:center}
.fin{max-width:420px;margin:0 auto}
.qr{display:block;width:min(80vw,340px);height:auto;margin:12px auto;padding:8px;border:2px solid #000;border-radius:6px;background:#fff}
.okc{width:120px;height:120px;margin:0 auto 12px;display:block}
.okc circle{stroke:#16a34a;stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dr .6s ease-out forwards}
.okc path{stroke:#16a34a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .5s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.tick{animation:none}.okc circle,.okc path{animation:none;stroke-dashoffset:0}}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
header{position:sticky;top:0;background:#fff;z-index:5}
header b{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid #000;border-radius:999px;padding:3px 12px;font-weight:700}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;padding:6px 2px;border-radius:10px}
nav a .ic{width:1.4em;height:1.4em}
.card{border-radius:12px;box-shadow:3px 3px 0 #000}
button,a.b{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px}
button:active,a.b:active{transform:translate(1px,1px)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{border-radius:10px}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.ib{width:38px;height:38px;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ld{display:flex;align-items:center;justify-content:center;gap:12px;padding:28px 0;font-weight:600}
.sp{width:26px;height:26px;border:3px solid #ddd;border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.go::after{content:"";position:fixed;top:0;left:0;width:40%;height:3px;background:#000;z-index:30;animation:bar 1s ease-in-out infinite}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){.sp{animation:none;border-top-color:#000}body.go::after{animation:none;width:100%}}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sm{width:auto;padding:8px 12px;margin:0;font-size:.85rem}
.act.go{background:#16a34a;border-color:#16a34a;color:#fff}
.act.wait{background:#eee;color:#000}
.tm{font-size:2.6rem;font-weight:800;text-align:center;margin:.1em 0;font-variant-numeric:tabular-nums}
.pb{height:12px;border:2px solid #000;border-radius:999px;overflow:hidden;background:#fff}
.pb i{display:block;height:100%;background:#000}
.av{width:44px;height:44px;border-radius:50%;border:2px solid #000;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:#fff}</style></head>

<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div id="sp"></div><div class="hd"><h1>Earn free points</h1><button class="o sm" id="rt"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg> Rates</button></div><div class="tabs" id="tabs"></div><div id="t"></div>
</main>
<script type="module">
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const say=(m,t,cb)=>{if(!m)return;const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" role="alertdialog"><b>${esc(t||'Notice')}</b><p>${esc(m)}</p><button>OK</button></div>`;d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON'){d.remove();cb&&cb()}};document.body.append(d)};
const ok=(m,t,cb)=>say(m,t||'Done',cb);
const ask=(t,m,ph)=>new Promise(res=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" role="dialog"><b>${esc(t)}</b><p>${esc(m)}</p>${ph?`<input placeholder="${esc(ph)}" autocapitalize="off" autocomplete="off">`:''}<button>Confirm</button><button class="o" style="margin-top:8px">Cancel</button></div>`;document.body.append(d);const i=d.querySelector('input'),[c,x]=d.querySelectorAll('button');c.onclick=()=>{d.remove();res(i?i.value:'')};x.onclick=()=>{d.remove();res(null)}});
const PL={youtube:'YouTube',instagram:'Instagram'};
const tok=localStorage.getItem('fp_t'),page=document.body.dataset.page,plat=localStorage.getItem('plat');
if((!tok||tok==='undefined')&&!['admin','setup-admin'].includes(page)){location.href='index.html';throw 0}
if(!plat&&!['home','buy','profiles','refer','store','admin','setup-admin'].includes(page)){location.href='home.html';throw 0}
const setPts=n=>{localStorage.setItem('fp_p',n);$('#pts').textContent=n;$('#pw').hidden=false};
if(localStorage.getItem('fp_p')){$('#pts').textContent=localStorage.getItem('fp_p');$('#pw').hidden=false}
async function api0(action,x={}){
  let r,j;
  try{r=await fetch('/api',{method:'POST',body:JSON.stringify({action,token:tok,...x})});j=await r.json()}catch(e){throw new Error('Cannot reach the server. Check your internet.')}
  if(r.status===401){localStorage.removeItem('fp_t');location.href='index.html';throw new Error('Please sign in again')}
  if(!r.ok)throw new Error(j.error||'Server error');
  return j;
}
let fly=0;
const hideLd=()=>{const l=$('#ld');if(l)l.remove()};
async function api(a,x){fly++;try{return await api0(a,x)}finally{if(--fly===0)setTimeout(hideLd,60)}}
setTimeout(hideLd,10000);
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(a&&/\.html/.test(a.getAttribute('href')))document.body.classList.add('go')});
addEventListener('pageshow',()=>document.body.classList.remove('go'));
const start=async()=>{try{const r=await api('me');setPts(r.user.points);
  const c=localStorage.getItem('fp_ref');if(c&&!r.user.refBy&&!(r.user.spent>0))api('useRef',{code:c}).catch(()=>{}).finally(()=>localStorage.removeItem('fp_ref'));
  return r}catch(e){say(e.message);throw e}};
const box=(t,h)=>{const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="pop" role="dialog"><b>${esc(t)}</b><div style="margin:.6em 0 1em">${h}</div><button>Close</button></div>`;d.onclick=e=>{if(e.target===d||e.target.tagName==='BUTTON')d.remove()};document.body.append(d)};
const platBar=()=>`<div class="tabs">${['youtube','instagram'].map(p=>`<button class="${p===plat?'':'o'}" data-sp="${p}">${I(p==='youtube'?'yt':'ig')} ${PL[p]}</button>`).join('')}</div>`;
const platBind=()=>document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{localStorage.setItem('plat',b.dataset.sp);location.reload()});
const logout=()=>{localStorage.removeItem('fp_t');localStorage.removeItem('fp_p');sessionStorage.clear();location.href='index.html'};
const I=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const CFG={apiKey:"AIzaSyBxl8tOaw6eJpRbl4Elx5YGvfaWGbry-_g",authDomain:"followpay-a7dfe.firebaseapp.com",projectId:"followpay-a7dfe",appId:"1:361285479601:web:3725e5d93893022b8dc690"};
async function upgrade(){
  try{const V='https://www.gstatic.com/firebasejs/10.12.2/',[A,B]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js')]);
    const c=await B.signInWithPopup(B.getAuth(A.initializeApp(CFG)),new B.GoogleAuthProvider());
    await api('linkGoogle',{idToken:await c.user.getIdToken()});
    ok('Your account is now linked to Google. You can sign in with Google any time.','Account upgraded',()=>location.reload());
  }catch(e){say(e.code==='auth/popup-closed-by-user'?'Sign-in window was closed.':e.code==='auth/unauthorized-domain'?'Add folowpay.netlify.app in Firebase authorized domains.':e.message,'Could not upgrade')}
}
$('#sp').innerHTML=platBar();platBind();
const yt=plat==='youtube';
$('#rt').onclick=()=>box('Earn rates',(yt?'<div class="row"><span>Subscribe</span><b>+2 points</b></div>':'<div class="row"><span>Follow</span><b>+2 points</b></div>')+'<div class="row"><span>Like</span><b>+1 point</b></div>'+(yt?'<div class="row"><span>Watch time</span><b>+3 points / minute</b></div><p class="m">Watch tasks are up to 15 minutes each.</p>':''));
const TY=yt?[['subscribe','Subscribe'],['like','Like'],['watch','Watch time']]:[['follow','Follow'],['like','Like']];
const TP={normal:'',premium:'Premium ',ultra:'Ultra premium '},AC={subscribe:'Subscribe',follow:'Follow',like:'Like',watch:'Start watching'};
let ty=sessionStorage.getItem('etype');if(!TY.some(x=>x[0]===ty))ty=TY[0][0];
const skip=[],fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
$('#tabs').innerHTML=TY.map(([k,n])=>`<button class="${k===ty?'':'o'}" data-ty="${k}">${I({subscribe:'bell',follow:'follow',like:'heart',watch:'clock'}[k])} ${n}</button>`).join('');
$('#tabs').querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{sessionStorage.setItem('etype',b.dataset.ty);location.reload()});
start().catch(()=>{});
let iv,curTick=null;
document.addEventListener('visibilitychange',()=>curTick&&curTick());
async function load(){
  clearInterval(iv);curTick=null;const t=$('#t');t.innerHTML='<p class="m">Loading task…</p>';
  try{
    const {task:x,left}=await api('tasks',{platform:plat,type:ty,skip});
    if(!x){t.innerHTML='<div class="card"><b>No tasks right now</b><p class="m">Check back soon, or pick another task type.</p></div>';return}
    const w=x.type==='watch',secs=w?x.mins*60:0;
    t.innerHTML=`<div class="card"><b>${TP[x.tier]}${x.type} task · ${esc(x.handle)}</b><p class="m">+${x.reward} points · ${left} available</p>${w?`<p class="tm" id="tm">${fmt(secs)}</p><p class="m" style="text-align:center">Time you need to watch</p>`:''}<button id="act" class="act">${AC[x.type]}</button><p style="text-align:center;margin:.6em 0 0"><a href="#" id="sk" class="m">Skip this task</a></p></div>`;
    let st=0,end=0;const b=$('#act'),tm=$('#tm');
    const tick=()=>{const s=Math.ceil((end-Date.now())/1000);tm.textContent=fmt(Math.max(s-2,0));if(s<=0){clearInterval(iv);b.disabled=false;b.className='act go';b.textContent='Verify'}};
    b.onclick=async()=>{
      if(st===0){window.open(x.link,'_blank','noopener');api('startTask',{orderId:x.id}).catch(e=>say(e.message));st=1;
        if(w){end=Date.now()+(secs+2)*1000;b.disabled=true;b.className='act wait';b.textContent='Keep watching';curTick=tick;tick();iv=setInterval(tick,500)}
        else{b.className='act go';b.textContent='Verify'}
        return}
      b.disabled=true;b.textContent='Checking…';
      try{const r=await api('verifyTask',{orderId:x.id});ok('+'+r.reward+' points added','Task complete',load);start().catch(()=>{})}
      catch(e){say(e.message,'Unable to verify');b.disabled=false;b.textContent='Verify'}
    };
    $('#sk').onclick=e=>{e.preventDefault();skip.push(x.id);load()};
  }catch(e){t.innerHTML='';say(e.message,'Cannot load tasks')}
}
load();
</script></body></html>
