ds</span></a><a href="refer.html"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg><span>Refer</span></a><a href="profiles.html"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg><span>Profile</span></a></nav>
<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div id="sp"></div><div class="hd"><h1>Earn free points</h1><button class="o sm" id="rt"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg> Rates</button></div><div class="tabs" id="tabs"></div><div id="t"></div>
</main>
<script src="/core.js?v=14"></script>
<script type="module">
$('#sp').innerHTML=platBar();platBind();
const yt=plat==='youtube',RT=(n,v)=>`<div class="row"><span>${n}</span><b>${v}</b></div>`;
$('#rt').onclick=()=>box('Earn rates',(yt?RT('Subscribe','+2 points'):RT('Follow','+2 points'))+RT('Like','+1 point')+RT('Views','+1 point')+RT('Comment','+1 point')+(yt?RT('Watch time','+6 points / minute')+'<p class="m">Watch tasks are up to 15 minutes each.</p>':''));
const TY=yt?[['subscribe','Subscribe'],['like','Like'],['views','Views'],['comment','Comment'],['watch','Watch time']]:[['follow','Follow'],['like','Like'],['views','Views'],['comment','Comment']];
const IC={subscribe:'bell',follow:'follow',like:'heart',views:'eye',comment:'msg',watch:'clock'};
const TP={normal:'',premium:'Premium ',ultra:'Ultra premium '},AC={subscribe:'Subscribe',follow:'Follow',like:'Like',views:'View',comment:'Comment',watch:'Start watching'};
const NT={subscribe:'subscribe',follow:'follow',like:'like',views:'view',comment:'comment',watch:'watch time'};
const HINT={views:'Open it and watch for a few seconds, then come back and tap Verify.',comment:'Write a comment there, then come back and tap Verify.'};
let ty=sessionStorage.getItem('etype');if(!TY.some(x=>x[0]===ty))ty=TY[0][0];
const skip=[],fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
$('#tabs').innerHTML=TY.map(([k,n])=>`<button class="${k===ty?'':'o'}" data-ty="${k}">${I(IC[k])} ${n}</button>`).join('');
$('#tabs').querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{sessionStorage.setItem('etype',b.dataset.ty);location.reload()});
start().catch(()=>{});
let iv,curTick=null;
document.addEventListener('visibilitychange',()=>curTick&&curTick());
async function load(){
  clearInterval(iv);curTick=null;const t=$('#t');t.innerHTML='<p class="m">Loading task…</p>';
  try{
    const {task:x,left}=await api('tasks',{platform:plat,type:ty,skip});
    if(!x){t.innerHTML='<div class="card"><b>No tasks right now</b><p class="m">Check back soon, or pick another task type.</p></div>';return}
    const w=x.type==='watch',secs=w?x.mins*60:0;
    t.innerHTML=`<div class="card"><div style="display:flex;gap:12px;align-items:center"><img class="av big" id="av" src="/pic?o=${x.id}" alt="" loading="lazy"><div><b>${esc(x.handle)}</b><p class="m" style="margin:0">${TP[x.tier]}${NT[x.type]} task · ${PL[plat]}</p></div></div><p class="m">+${x.reward} point${x.reward>1?'s':''} · ${left} available</p>${HINT[x.type]?`<p class="m">${HINT[x.type]}</p>`:''}${w?`<p class="tm" id="tm">${fmt(secs)}</p><p class="m" style="text-align:center">Time you need to watch</p>`:''}<button id="act" class="act">${AC[x.type]}</button><p style="text-align:center;margin:.6em 0 0"><a href="#" id="sk" class="m">Skip this task</a></p></div>`;
    $('#av').onerror=function(){this.outerHTML='<span class="av big">'+esc(x.handle.replace('@','').charAt(0).toUpperCase())+'</span>'};
    let st=0,end=0;const b=$('#act'),tm=$('#tm');
    const tick=()=>{const s=Math.ceil((end-Date.now())/1000);tm.textContent=fmt(Math.max(s-2,0));if(s<=0){clearInterval(iv);b.disabled=false;b.className='act go';b.textContent='Verify'}};
    b.onclick=async()=>{
      if(st===0){window.open(x.link,'_blank','noopener');api('startTask',{orderId:x.id}).catch(e=>say(e.message));st=1;
        if(w){end=Date.now()+(secs+2)*1000;b.disabled=true;b.className='act wait';b.textContent='Keep watching';curTick=tick;tick();iv=setInterval(tick,500)}
        else{b.className='act go';b.textContent='Verify'}
        return}
      b.disabled=true;b.textContent='Checking…';
      try{const r=await api('verifyTask',{orderId:x.id});ok('+'+r.reward+' point'+(r.reward>1?'s':'')+' added','Task complete',load);start().catch(()=>{})}
      catch(e){say(e.message,'Unable to verify');b.disabled=false;b.textContent='Verify'}
    };
    $('#sk').onclick=e=>{e.preventDefault();skip.push(x.id);load()};
  }catch(e){t.innerHTML='';say(e.message,'Cannot load tasks')}
}
load();
</script></body></html>
