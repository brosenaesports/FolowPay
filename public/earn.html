<main>
<div class="ld" id="ld" role="status" aria-live="polite"><span class="sp"></span><span>Loading…</span></div>
<div id="sp"></div><div class="hd"><h1>Earn free points</h1><button class="o sm" id="rt"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg> Rates</button></div><div id="skb"></div><div id="t"></div>
</main>
<script src="/core.js?v=30"></script>
<script type="module">
$('#sp').innerHTML=platBar();platBind();
const yt=plat==='youtube',RT=(n,v)=>`<div class="row"><span>${n}</span><b>${v}</b></div>`;
$('#rt').onclick=()=>box('Earn rates',(yt?RT('Subscribe','+1 point'):RT('Follow','+2 points'))+RT('Like','+1 point')+RT('Views','+1 point')+RT('Comment','+1 point')+(yt?RT('Watch time','+6 points / minute')+'<p class="m">Watch tasks are up to 15 minutes each.</p>':''));
const IC={subscribe:'bell',follow:'follow',like:'heart',views:'eye',comment:'msg',watch:'clock'};
const TP={normal:'',premium:'Premium ',ultra:'Ultra premium '},AC={subscribe:'Subscribe',follow:'Follow',like:'Like',views:'View',comment:'Comment',watch:'Start watching'};
const NT={subscribe:'subscribe',follow:'follow',like:'like',views:'view',comment:'comment',watch:'watch time'};
const HINT={views:'Open it and watch for a few seconds, then come back and tap Verify.',comment:'Write a comment there, then come back and tap Verify.'};
let skipIds=[];try{skipIds=JSON.parse(sessionStorage.getItem('eskip')||'[]')}catch{}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
start().catch(()=>{});
let iv,curTick=null;
document.addEventListener('visibilitychange',()=>curTick&&curTick());
const skBar=(n,st)=>n>0
  ?`<div class="sk on"><span class="big-ic">${I('swap')}</span><div><b>${n} skip${n>1?'s':''} unlocked</b><p class="m" style="margin:0">Not interested in a task? You can skip it.</p></div></div>`
  :`<div class="sk"><span class="big-ic">${I('lock')}</span><div style="flex:1"><b>Complete 3 tasks to unlock 2 skips</b><div class="pb" style="margin:6px 0" role="progressbar" aria-valuenow="${st}" aria-valuemin="0" aria-valuemax="3"><i style="width:${Math.round(st/3*100)}%"></i></div><p class="m" style="margin:0">${st} of 3 done</p></div></div>`;
async function load(){
  clearInterval(iv);curTick=null;const t=$('#t');t.innerHTML='<p class="m">Finding a task for you…</p>';
  try{
    const {task:x,skips,streak}=await api('tasks',{platform:plat,skip:skipIds});
    $('#skb').innerHTML=skBar(skips,streak);
    if(!x){t.innerHTML=`<div class="card"><b>No tasks right now</b><p class="m">Check back soon for new tasks.</p>${skipIds.length?'<button class="o" id="rs">Show skipped tasks again</button>':''}</div>`;
      if($('#rs'))$('#rs').onclick=()=>{skipIds=[];sessionStorage.removeItem('eskip');load()};return}
    const w=x.type==='watch',secs=w?x.mins*60:0;
    t.innerHTML=`<div class="card tk"><div class="tkh"><img class="av big" id="av" src="/pic?o=${x.id}" alt="" loading="lazy"><div><b style="font-size:1.2rem">${esc(x.handle)}</b><p class="m" style="margin:0">${PL[plat]}${x.tier!=='normal'?' · '+TP[x.tier].trim():''}</p></div></div>
      <div class="sh" style="margin:14px 0 0"><span class="big-ic">${I(IC[x.type])}</span><h2 style="margin:0">${AC[x.type]==='Start watching'?'Watch':AC[x.type]}</h2></div>
      <span class="rwd">${I('coin')} +${x.reward} point${x.reward>1?'s':''}</span>
      ${HINT[x.type]?`<p class="m">${HINT[x.type]}</p>`:''}${w?`<p class="tm" id="tm">${fmt(secs)}</p><p class="m" style="text-align:center">Time you need to watch</p>`:''}
      <button id="act" class="act">${AC[x.type]}</button>
      <button id="sk" class="o"${skips>0?'':' disabled'}>${I('swap')} Skip this task${skips>0?' ('+skips+' left)':''}</button>${skips>0?'':'<p class="m" style="text-align:center;margin:.2em 0 0">Skips unlock after you complete 3 tasks.</p>'}</div>`;
    $('#av').onerror=function(){this.outerHTML='<span class="av big">'+esc(x.handle.replace('@','').charAt(0).toUpperCase())+'</span>'};
    let st=0,end=0;const b=$('#act'),tm=$('#tm');
    const tick=()=>{const s=Math.ceil((end-Date.now())/1000);tm.textContent=fmt(Math.max(s-2,0));if(s<=0){clearInterval(iv);b.disabled=false;b.className='act go';b.textContent='Verify'}};
    b.onclick=async()=>{
      if(st===0){window.open(x.link,'_blank','noopener');api('startTask',{orderId:x.id}).catch(e=>say(e.message));st=1;
        if(w){end=Date.now()+(secs+2)*1000;b.disabled=true;b.className='act wait';b.textContent='Keep watching';curTick=tick;tick();iv=setInterval(tick,500)}
        else{b.className='act go';b.textContent='Verify'}
        return}
      b.disabled=true;b.textContent='Checking…';
      try{const r=await api('verifyTask',{orderId:x.id});ok('+'+r.reward+' point'+(r.reward>1?'s':'')+' added'+(r.unlocked?'. You unlocked 2 skips!':''),'Task complete',load);start().catch(()=>{})}
      catch(e){say(e.message,'Unable to verify');b.disabled=false;b.textContent='Verify'}
    };
    $('#sk').onclick=async()=>{try{await api('skipTask',{orderId:x.id});skipIds.push(x.id);sessionStorage.setItem('eskip',JSON.stringify(skipIds.slice(-100)));load()}catch(e){say(e.message,'Cannot skip');load()}};
  }catch(e){t.innerHTML='';say(e.message,'Cannot load tasks')}
}
load();
</script></body></html>
